var JB_KEYS=['sinoon_promo_memos','sinoon_promo_data','sinoon_s4_sparse_edits',
  'sinoon_mkt_budget','sinoon_mkt_spend','sinoon_mkt_target','sinoon_mkt_spend_total',

  'sinoon_scm_edits','sinoon_aov_data','sinoon_cust_weekly','sinoon_conv_extra',
  'sinoon_s2_memo','sinoon_s4_col_w','sinoon_s4_row_h'];
var s4={mon:'',ch:'전체'};

function _fbGetHash(){
  var s='';
  JB_KEYS.forEach(function(k){var v=localStorage.getItem(k);if(v)s+=v.length+',';});
  return s;
}

// Firebase에 PUT (공통)
function _jbPutAll(onOk,onErr){
  var d={};
  JB_KEYS.forEach(function(k){var v=localStorage.getItem(k);if(v)d[k]=v;});
  fetch(FB_URL+'?t='+Date.now(),{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(d)
  }).then(function(r){
    if(r.ok){_fbLastHash=_fbGetHash();if(onOk)onOk();}
    else{if(onErr)onErr(r.status);}
  }).catch(function(e){if(onErr)onErr(e);});
}

function jsonbinSave(){
  clearTimeout(_jbSaveTimer);
  _jbSaveTimer=setTimeout(function(){_jbPutAll(null,function(e){console.warn('Firebase 동기화 오류:',e);});},800);
}

// 가져온 데이터를 localStorage + 화면에 적용
function _jbApplyData(d){
  JB_KEYS.forEach(function(k){if(d[k])localStorage.setItem(k,d[k]);});
  // 열너비·행높이 메모리 변수 갱신 후 테이블 즉시 반영
  try{
    localStorage.removeItem('sinoon_s4_col_w');
    localStorage.removeItem('sinoon_s4_row_h');
    s4ColWidths={};s4RowHeights={};
  }catch(e){}
  try{s4LoadFullPromo();}catch(e){}
  try{mktLoad();}catch(e){}
  try{s2Memo=_s2LoadMemo();s2Top();}catch(e){}
  var btns=[...document.querySelectorAll('.tab-btn')];
  var ai=btns.indexOf(document.querySelector('.tab-btn.active'));
  if(ai===1)try{buildTop3();buildAchGraph();buildYoY();buildMonthlyGoal();}catch(e){}
  if(ai===3)try{renderTab3();}catch(e){}
  if(ai===4)try{renderTab4();}catch(e){}
  if(ai===5)try{renderTabMkt();}catch(e){}
  var n=document.getElementById('jb-sync-notice');
  if(n){n.textContent='🔄 새 데이터 업데이트됨';n.style.opacity='1';
    setTimeout(function(){n.style.opacity='0';},2500);}
}

// 30초마다 변경 감지 폴링
function _jbPoll(){
  fetch(FB_URL+'?t='+Date.now())
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d||typeof d!=='object')return;
    var newHash='';
    JB_KEYS.forEach(function(k){if(d[k])newHash+=d[k].length+',';});
    if(newHash&&newHash!==_fbLastHash){_fbLastHash=newHash;_jbApplyData(d);}
  }).catch(function(){});
}

function jsonbinLoad(callback){
  fetch(FB_URL+'?t='+Date.now())
  .then(function(r){return r.json();})
  .then(function(d){
    if(d&&typeof d==='object'){
      JB_KEYS.forEach(function(k){if(d[k])localStorage.setItem(k,d[k]);});
      _fbLastHash=_fbGetHash();
      // 열너비·행높이 메모리 변수 갱신
      try{
        localStorage.removeItem('sinoon_s4_col_w');
        localStorage.removeItem('sinoon_s4_row_h');
        s4ColWidths={};s4RowHeights={};
      }catch(e){}
    }
    if(callback)callback();
  })
  .catch(function(){if(callback)callback();});
}

// ── 신상/이월 + 시즌별 동적 계산 (D.ps_data 기준) ──────────────
function _calcMonthSeasonDynamic(mLabel) {
  const season = {신상: 0, 이월: 0};
  const division = {신상: 0, 이월: 0, 캐리오버: 0, 익스클루시브: 0};
  if (!D.ps_data) return {season, division};
  for (const code in D.ps_data) {
    const p = D.ps_data[code];
    const monData = p.by_mon && p.by_mon[mLabel];
    if (!monData) continue;
    const net = (monData.s || 0) - (monData.r || 0);
    if (net <= 0) continue;
    const info = ITEM_SEASON_MAP[code];
    let nv, dv;
    if (info) { nv = info.n; dv = info.d; }
    else {
      // D.ps_data co/season 기반 분류
      const psCo = p.co || '';
      const psSeason = p.season || '';
      if (psCo === '신규캐리오버') { nv = '신상'; dv = '캐리오버'; }
      else if (psCo === '캐리오버') { nv = '이월'; dv = '캐리오버'; }
      else {
        const is26 = psSeason ? /^26/.test(psSeason) : /^SN2G/.test(code);
        nv = is26 ? '신상' : '이월';
        dv = is26 ? '신상' : '이월';
      }
    }
    season[nv] = (season[nv] || 0) + net;
    if (dv === '익스클루시브') division['익스클루시브'] = (division['익스클루시브'] || 0) + net;
    else if (dv === '캐리오버') division['캐리오버'] = (division['캐리오버'] || 0) + net;
    else division[nv] = (division[nv] || 0) + net;
  }
  return {season, division};
}

  const fmt=d=>{const p=d.slice(5).replace('-','/');return p.replace(/^0/,'');};
  return w+' ('+fmt(dates[0])+'~'+fmt(dates[dates.length-1])+')';
}
function won(n){return (n||0).toLocaleString('ko-KR');}
function wonShort(n){n=n||0;if(Math.abs(n)>=100000000)return (n/100000000).toFixed(1)+'억';if(Math.abs(n)>=10000)return Math.round(n/10000)+'만';return n.toLocaleString('ko-KR');}
function wonKr(n){n=n||0;var a=Math.abs(n),s=n<0?'-':'';if(a>=100000000)return s+(Math.round(a/10000000)/10).toFixed(1)+'억';if(a>=10000000)return s+(Math.round(a/1000000)*100).toLocaleString('ko-KR')+'만';if(a>=1000000)return s+(Math.round(a/100000)*10).toLocaleString('ko-KR')+'만';if(a>=100000)return s+Math.round(a/10000).toLocaleString('ko-KR')+'만';return s+a.toLocaleString('ko-KR');}
function sv(obj,key,sub){if(!obj||obj[key]===undefined||obj[key]===null)return 0;if(sub!==undefined)return obj[key][sub]||0;return obj[key]||0;}
function m26s(m,ch){return sv(D.monthly26[m],ch,'s');}
function m26r(m,ch){return sv(D.monthly26[m],ch,'r');}
function m25s(m,ch){const v=D.monthly25[m];if(!v||v[ch]===undefined)return 0;return v[ch]||0;}

// ── 동기간 신장률 헬퍼 (진행 중인 월 → 같은 날짜 범위로 비교) ──
const _MON_IDX_LIST=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
function _monPfx26(mon){return '2026-'+String(_MON_IDX_LIST.indexOf(mon)+1).padStart(2,'0');}
function _monPfx25(mon){return '2025-'+String(_MON_IDX_LIST.indexOf(mon)+1).padStart(2,'0');}
function _monAvailDates26(mon){const pfx=_monPfx26(mon);return Object.keys(D.daily26).filter(d=>d.startsWith(pfx)).sort();}
function _isIncompleteMon(mon){
  // daily26에 있는 최신일이 해당 월 말일보다 이전이면 진행 중인 달로 판단
  const dates=_monAvailDates26(mon);if(!dates.length)return false;
  const maxDay=parseInt(dates[dates.length-1].slice(8));
  const monIdx=_MON_IDX_LIST.indexOf(mon);
  const lastDay=new Date(2026,monIdx+1,0).getDate();
  return maxDay<lastDay;
}
function _yoy_same_period(mon,ch){
  // 진행 중인 달: daily25에서 동일 날짜 합산
  const dates=_monAvailDates26(mon);if(!dates.length)return m25s(mon,ch);
  const pfx25=_monPfx25(mon);
  let sum=0;
  dates.forEach(d=>{const d25=pfx25+d.slice(7);sum+=sv(D.daily25[d25],ch)||0;});
  return sum;
}
function _mom_same_period_net(mon,ch){
  // 진행 중인 달: 이전 달의 동일 날짜 범위 net 합산
  const dates=_monAvailDates26(mon);if(!dates.length)return 0;
  const monIdx=_MON_IDX_LIST.indexOf(mon);if(monIdx===0)return 0;
  const prevPfx='2026-'+String(monIdx).padStart(2,'0');
  let sum=0;
  dates.forEach(d=>{
    const dPrev=prevPfx+d.slice(7);
    sum+=(sv(D.daily26[dPrev],ch,'s')||0)-(sv(D.daily26[dPrev],ch,'r')||0);
  });
  return sum;
}
function _weekly_yoy_same_period(wk,ch){
  // weekly25 키 불일치 문제 해결: week_to_dates 기반으로 daily25 동기간 합산
  const dates26=D.week_to_dates[wk]||[];
  if(!dates26.length)return sv(D.weekly25[wk],ch)||0;
  let sum=0;
  dates26.forEach(d=>{
    const d25='2025'+d.slice(4); // '2026-07-01' → '2025-07-01'
    sum+=sv(D.daily25[d25],ch)||0;
  });
  return sum;
}
function yoyStr(v26,v25){if(!v25)return '-';const p=((v26-v25)/v25*100).toFixed(1);return p>0?'+'+p+'%':p+'%';}
function yoyClass(v26,v25){if(!v25)return '';return v26>=v25?'pos-val':'neg-val';}

function downloadExcel(){
  try{
    // 현재 활성 탭
    const tabBtns=[...document.querySelectorAll('.tab-btn')];
    const activeIdx=tabBtns.findIndex(b=>b.classList.contains('active'));
    const tabNames=['Overview','Sales & Targets','Channels','Products','Analytics','Promotions','Marketing'];
    const tabName=tabNames[activeIdx]||'데이터';
    const activeContent=document.querySelectorAll('.tab-content')[activeIdx];
    if(!activeContent){alert('탭 콘텐츠를 찾을 수 없습니다.');return;}

    // ── 1. DOM 클론 ──
    const clone=activeContent.cloneNode(true);

    // ── 2. 불필요 요소 제거 ──
    clone.querySelectorAll('button,input,select,textarea,canvas,svg').forEach(el=>el.remove());

    // ── 3. 접혀있는 행 펼치기 (전체 데이터 포함) ──
    clone.querySelectorAll('tr').forEach(tr=>{
      if(tr.style.display==='none')tr.style.display='table-row';
    });

    // ── 4. 라이브 DOM에서 computed style → 클론 셀에 인라인 주입 ──
    const liveCells=[...activeContent.querySelectorAll('td,th')];
    const cloneCells=[...clone.querySelectorAll('td,th')];
    liveCells.forEach((live,i)=>{
      const cl=cloneCells[i];if(!cl)return;
      const cs=window.getComputedStyle(live);
      cl.style.backgroundColor=cs.backgroundColor;
      cl.style.color=cs.color;
      cl.style.fontWeight=cs.fontWeight;
      cl.style.fontSize=cs.fontSize;
      cl.style.textAlign=cs.textAlign;
      cl.style.verticalAlign=cs.verticalAlign;
      cl.style.padding='4px 8px';
      cl.style.border='1px solid #ccc';
      cl.style.whiteSpace='nowrap';
    });

    // ── 5. 내부 span 스타일도 인라인 주입 ──
    const liveSpans=[...activeContent.querySelectorAll('td span,th span')];
    const cloneSpans=[...clone.querySelectorAll('td span,th span')];
    liveSpans.forEach((live,i)=>{
      const cl=cloneSpans[i];if(!cl)return;
      const cs=window.getComputedStyle(live);
      cl.style.color=cs.color;
      cl.style.fontWeight=cs.fontWeight;
    });

    // ── 6. Excel HTML 문서 생성 ──
    const today=new Date();
    const dateStr=`${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
    const safeTab=tabName.replace(/[&\/\\]/g,'_');

    const htmlDoc=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<style>
  table{border-collapse:collapse;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;}
  td,th{border:1px solid #ccc;padding:4px 8px;white-space:nowrap;}
  .card-title{font-size:13px;font-weight:700;color:#111;padding:8px 0 4px;border:none;background:none;}
</style>
</head>
<body>${clone.innerHTML}</body>
</html>`;

    // ── 7. Blob 다운로드 ──
    const blob=new Blob(['﻿',htmlDoc],{type:'application/vnd.ms-excel;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`SINOON_${safeTab}_${dateStr}.xls`;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(err){
    console.error('Excel 다운로드 오류:',err);
    alert('다운로드 중 오류가 발생했습니다:\n'+err.message);
  }
}

function renderTabTarget(){
  const el=document.getElementById('tab1');if(!el)return;
  const ALL_CH=['자사몰','29CM','무신사','카카오톡','자사몰_해외','무신사글로벌','NUGU_일본'];
  if(!window.tgtSt)window.tgtSt={mon:CUR_MON};
  if(window.tgtShowDays===undefined)window.tgtShowDays=false;

  function wm(v){if(!v)return'';const m=Math.round(v/10000);return m.toLocaleString()+'만';}

  const dataMons=MONTHS.filter(m=>hasMon(m));
  function chAnnTgt(ch){return D.targets[ch]?Object.values(D.targets[ch]).reduce((a,v)=>a+v,0):0;}
  function chYtd26(ch){return dataMons.reduce((a,m)=>a+m26s(m,ch)-m26r(m,ch),0);}
  function chAnn25(ch){
    // 동기간 일단위: D.dates 마지막 날짜(2026-MM-DD) → 2025-MM-DD 컷오프
    const lastDate26=D.dates[D.dates.length-1]||'';
    const cutoff25=lastDate26.replace(/^2026/,'2025');
    if(!D.daily25||!cutoff25)return 0;
    return Object.entries(D.daily25).reduce((a,[dt,v])=>{
      if(dt<=cutoff25) a+=(v[ch]||0);
      return a;
    },0);
  }

  const totAnnTgt=ALL_CH.reduce((a,ch)=>a+chAnnTgt(ch),0);
  const totYtd26=ALL_CH.reduce((a,ch)=>a+chYtd26(ch),0);
  const totAnn25=ALL_CH.reduce((a,ch)=>a+chAnn25(ch),0);
  const annAch=totAnnTgt?totYtd26/totAnnTgt*100:0;
  const annFc=annAch>=100?'#1e7a4a':annAch>=50?'#d4830a':'#c0392b';

  const BD='border:1px solid #d4c9bc;';
  /* 연간 테이블 셀: 모두 center, vertical-align middle */
  const TH_S=`padding:10px 8px;text-align:center;vertical-align:middle;font-weight:600;color:#111;font-size:13px;${BD}`;
  const TD_C=`padding:10px 8px;text-align:center;vertical-align:middle;${BD}`;
  const TD_L=`padding:10px 12px;text-align:center;vertical-align:middle;${BD}`;

  const annCards=ALL_CH.map(ch=>{
    const tgt=chAnnTgt(ch),n26=chYtd26(ch),n25=chAnn25(ch);
    const ach=tgt?n26/tgt*100:0;
    const yoy=n25?((n26-n25)/n25*100):null;
    const achFc=ach>=100?'#4ecb7e':ach>=50?'#f5a623':'#e74c3c';
    const yoyFc=yoy===null?'rgba(255,255,255,.4)':yoy>=0?'#4ecb7e':'#e74c3c';
    const yoyTxt=yoy===null?'-':(yoy>=0?'+':'')+yoy.toFixed(1)+'%';
    return`<div style="background:#2d2926;border-radius:12px;padding:16px 18px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <div style="width:10px;height:10px;border-radius:50%;background:${CH_COLORS[ch]||'#8b6f5e'};flex-shrink:0;"></div>
        <span style="font-size:15px;font-weight:700;color:#fff;">${dn(ch)}</span>
      </div>
      <div style="height:8px;background:#5a4f4a;border-radius:4px;overflow:hidden;margin-bottom:10px;">
        <div style="width:${Math.min(100,ach).toFixed(1)}%;height:100%;background:${achFc};border-radius:4px;"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:22px;font-weight:700;color:${achFc};">${tgt?ach.toFixed(1)+'%':'-'}</span>
        <span style="font-size:14px;font-weight:700;color:${yoyFc};">YoY ${yoyTxt}</span>
      </div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.1);padding-top:10px;">
        <div>
          <div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:3px;">연목표</div>
          <div style="font-size:13px;font-weight:600;color:rgba(255,255,255,.75);">${tgt?wonKr(tgt):'-'}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:3px;">YTD 실적</div>
          <div style="font-size:13px;font-weight:700;color:#fff;">${n26?wonKr(n26):'-'}</div>
        </div>
      </div>
    </div>`;
  });

  const totAch=totAnnTgt?totYtd26/totAnnTgt*100:0;
  const totFc=totAch>=100?'#1e7a4a':totAch>=50?'#d4830a':'#c0392b';
  const totYoy=totAnn25?((totYtd26-totAnn25)/totAnn25*100):null;
  const totYoyFc=totYoy===null?'#bbb':totYoy>=0?'#1e7a4a':'#c0392b';
  const totYoyTxt=totYoy===null?'-':(totYoy>=0?'+':'')+totYoy.toFixed(1)+'%';

  const availMons=MONTHS.filter(m=>D.month_to_weeks[m]);

  function renderDailyTgt(){

    const DAYS=['일','월','화','수','목','금','토'];

    /* 선택 월 prefix */

    const monPrefix='2026-'+(MON_NUM_IDX+1+'').padStart(2,'0');

    /* 7월 이후 NUGU_일본 제외 */
    const DISP_CH=MON_NUM_IDX>=6?ALL_CH.filter(ch=>ch!=='NUGU_일본'):ALL_CH;
    const IS_NUGU=(ch)=>ch==='NUGU_일본';

    const BG_HEADER='#EEE1E7';
    const BG_NUGU='#B7B7B7';
    const BG_SUM_COL='#FFF2CC';
    const BG_TGT='#FFFFFF';
    const BG_ACT='#EFEFEF';
    const BG_PCT='#D9D9D9';
    const BG_WK_TGT='#EAD1DC';
    const BG_WK_ACT='#E9BDD2';

    function pct(p,hasTgt){if(!hasTgt)return'-';return Math.round(p*100)+'%';}

    function monChTgt(ch){return D.targets[ch]?D.targets[ch][mon]||0:0;}
    function monChAct(ch){return m26s(mon,ch)-m26r(mon,ch);}
    const totMTgt=DISP_CH.reduce((a,ch)=>a+monChTgt(ch),0);
    const totMAct=DISP_CH.reduce((a,ch)=>a+monChAct(ch),0);

    const allWkKeys=Object.keys(D.week_to_dates).sort((a,b)=>{
      const da=(D.week_to_dates[a]||[])[0]||'';
      const db=(D.week_to_dates[b]||[])[0]||'';
      return da.localeCompare(db);
    });
    /* 해당 월 + 평일인 날짜만, 주차별로 그룹 */
    const wkGroups=[];
    allWkKeys.forEach(wk=>{
      const dates=(D.week_to_dates[wk]||[]).filter(d=>{
        if(!d.startsWith(monPrefix))return false;

      });
      if(dates.length>0) wkGroups.push({wk,dates});
    });

    let html=`<div style="overflow-x:auto">
    <table style="border-collapse:collapse;font-size:13px;border:${BD2};width:100%">
    <tbody>
    <tr>
      <td style="${CS(BG_HEADER,'font-weight:700;border:2px solid #AAAAAA')}" colspan="2">2026</td>
      <td style="${CS(BG_HEADER,'font-weight:700')}">구분</td>`;
    DISP_CH.forEach(ch=>{
      const bg=IS_NUGU(ch)?BG_NUGU:BG_HEADER;
      html+=`<td style="${CS(bg,'font-weight:700;min-width:88px')}">${dn(ch)}</td>`;
    });
    html+=`<td style="${CS(BG_HEADER,'font-weight:700')}">합계</td></tr>

    <tr>
      <td style="${CS('','font-weight:700;color:#FF0000')}" colspan="3">월 목표</td>`;
    DISP_CH.forEach(ch=>{
      const t=monChTgt(ch);
      const bg=IS_NUGU(ch)?BG_NUGU:'';
      html+=`<td style="${CS(bg,'font-weight:700;color:#FF0000')}">${fmt(t)||'0'}</td>`;
    });
    html+=`<td style="${CS(BG_SUM_COL,'font-weight:700;color:#FF0000')}">${fmt(totMTgt)}</td></tr>

    <tr>
      <td style="${CS('','font-weight:700;color:#0000FF')}" colspan="3">달성</td>`;
    DISP_CH.forEach(ch=>{
      const a=monChAct(ch);
      const bg=IS_NUGU(ch)?BG_NUGU:'';
      html+=`<td style="${CS(bg,'font-weight:700;color:#0000FF')}">${fmt(a)}</td>`;
    });
    html+=`<td style="${CS(BG_SUM_COL,'font-weight:700;color:#0000FF')}">${fmt(totMAct)}</td></tr>

    <tr>
      <td style="${CS('','font-weight:700')}" colspan="3">달성율</td>`;
    DISP_CH.forEach(ch=>{
      const t=monChTgt(ch),a=monChAct(ch),p=t?a/t:null;
      const bg=IS_NUGU(ch)?BG_NUGU:'';
      html+=`<td style="${CS(bg,'font-weight:700')}">${pct(p,t)}</td>`;
    });
    const tp=totMTgt?totMAct/totMTgt:null;
    html+=`<td style="${CS(BG_SUM_COL,'font-weight:700')}">${pct(tp,totMTgt)}</td></tr>

    <tr><td colspan="${3+DISP_CH.length+1}" style="height:2px;background:#AAAAAA;padding:0;border:none"></td></tr>`;

    let ownWkIdx=0;
    wkGroups.forEach(({wk,dates})=>{
      /* 해당 월 소속 주차 → 순번(1주차…), 타 월 → 원래 주차명(5월4주차 등) */
      const isOwnMonth=wk.startsWith(mon);
      let wkN;
      if(isOwnMonth){ownWkIdx++;wkN=ownWkIdx+'주차';}
      else{wkN=wk+'차';}

      const wkT={},wkA={};
      DISP_CH.forEach(ch=>{wkT[ch]=0;wkA[ch]=0;});
      dates.forEach(d=>{
        const tgt=D.daily_target[d]||{},act=D.daily26[d]||{};
        DISP_CH.forEach(ch=>{wkT[ch]+=tgt[ch]||0;wkA[ch]+=(act[ch]?.s||0)-(act[ch]?.r||0);});
      });
      const wkTT=DISP_CH.reduce((a,ch)=>a+wkT[ch],0);
      const wkTA=DISP_CH.reduce((a,ch)=>a+wkA[ch],0);

      dates.forEach(d=>{
        const tgt=D.daily_target[d]||{},act=D.daily26[d]||{};
        const hasAct=hasData(d);
        const dp=d.slice(5).replace('-','/');
        const di=new Date(d).getDay();
        const DATE_NOTES={'2026-07-03':'택배출고X'};
        const noteHtml=DATE_NOTES[d]?`<br><span style="font-size:13px;color:#e74c3c;font-weight:700;">${DATE_NOTES[d]}</span>`:'';
        const day=DAYS[di];
        const noTgt=DISP_CH.every(ch=>!(tgt[ch]||0));
        const dateFc=noTgt?'color:#FF0000':'';

          <td style="${CS(BG_TGT,'font-weight:400')}">목표</td>`;
        DISP_CH.forEach(ch=>{
          const t=tgt[ch]||0;
          const bg=IS_NUGU(ch)?BG_NUGU:BG_TGT;
          tgtRow+=`<td style="${CS(bg,'')}">${fmt(t)||'0'}</td>`;
        });
        const rTotT=DISP_CH.reduce((a,ch)=>a+(tgt[ch]||0),0);
        tgtRow+=`<td style="${CS(BG_TGT,'')}">${fmt(rTotT)||'0'}</td></tr>`;

        let actRow=`<tr class="tgt-day-row" style="${opac}display:${dayDisp};">
          <td style="${CS(BG_ACT,'font-weight:400')}">달성</td>`;
        DISP_CH.forEach(ch=>{
          const s=(act[ch]?.s||0)-(act[ch]?.r||0);
          const bg=IS_NUGU(ch)?BG_NUGU:BG_ACT;
          const fc=s<0?'color:#FF0000':'';
          actRow+=`<td style="${CS(bg,fc)}">${hasAct?fmt(s):''}</td>`;
        });
        const rTotA=DISP_CH.reduce((a,ch)=>a+(act[ch]?.s||0)-(act[ch]?.r||0),0);
        const rTotFc=rTotA<0?'color:#FF0000':'';
        actRow+=`<td style="${CS(BG_ACT,rTotFc)}">${hasAct?fmt(rTotA):''}</td></tr>`;

        let pctRow=`<tr class="tgt-day-row" style="${opac}display:${dayDisp};">
          <td style="${CS(BG_PCT,'font-weight:700')}">달성율</td>`;
        DISP_CH.forEach(ch=>{
          const t=tgt[ch]||0,s=(act[ch]?.s||0)-(act[ch]?.r||0);
          const p=t?s/t:null;
          const bg=IS_NUGU(ch)?BG_NUGU:BG_PCT;
          pctRow+=`<td style="${CS(bg,'font-weight:700')}">${hasAct?pct(p,t):'-'}</td>`;
        });
        const rTotP=rTotT?rTotA/rTotT:null;
        pctRow+=`<td style="${CS(BG_PCT,'font-weight:700')}">${hasAct?pct(rTotP,rTotT):'-'}</td></tr>`;

        html+=tgtRow+actRow+pctRow;
      });

      /* 주차 합계 - wkN(rowspan=3) + 합(rowspan=3) 분리 */
      const wkDayDisp=window.tgtShowDays?'▲ 접기':'▼ 펼치기';
      let wkTgtRow=`<tr>
        <td data-wk-label="1" style="${CS(BG_WK_TGT,'font-weight:700;cursor:pointer;')}" rowspan="3" onclick="toggleTgtDays()" title="일자별 행 보기/숨기기">${wkN}<br><span class="wk-toggle-hint" style="font-size:13px;color:#111;">${wkDayDisp}</span></td>
        <td style="${CS(BG_WK_TGT,'font-weight:700')}" rowspan="3">합</td>
        <td style="${CS(BG_WK_TGT,'font-weight:700')}">목표</td>`;
      DISP_CH.forEach(ch=>{
        const bg=IS_NUGU(ch)?BG_NUGU:BG_WK_TGT;
        wkTgtRow+=`<td style="${CS(bg,'font-weight:700')}">${fmt(wkT[ch])||'0'}</td>`;
      });
      wkTgtRow+=`<td style="${CS(BG_WK_TGT,'font-weight:700')}">${fmt(wkTT)}</td></tr>`;

      let wkActRow=`<tr>
        <td style="${CS(BG_WK_ACT,'font-weight:700')}">달성</td>`;
      DISP_CH.forEach(ch=>{
        const bg=IS_NUGU(ch)?BG_NUGU:BG_WK_ACT;
        const fc=wkA[ch]<0?'color:#FF0000':'';
        wkActRow+=`<td style="${CS(bg,'font-weight:700;'+fc)}">${fmt(wkA[ch])}</td>`;
      });
      const wkTAFc=wkTA<0?'color:#FF0000':'';
      wkActRow+=`<td style="${CS(BG_WK_ACT,'font-weight:700;'+wkTAFc)}">${fmt(wkTA)}</td></tr>`;

      let wkPctRow=`<tr>
        <td style="${CS(BG_WK_PCT,'font-weight:700')}">달성율</td>`;
      DISP_CH.forEach(ch=>{
        const t=wkT[ch],a=wkA[ch],p=t?a/t:null;
        const bg=IS_NUGU(ch)?BG_NUGU:BG_WK_PCT;
        wkPctRow+=`<td style="${CS(bg,'font-weight:700')}">${pct(p,t)}</td>`;
      });
      const wkP=wkTT?wkTA/wkTT:null;
      wkPctRow+=`<td style="${CS(BG_WK_PCT,'font-weight:700')}">${pct(wkP,wkTT)}</td></tr>
      <tr><td colspan="${3+DISP_CH.length+1}" style="height:2px;background:#AAAAAA;padding:0;border:none"></td></tr>`;

      html+=wkTgtRow+wkActRow+wkPctRow;
    });

    html+=`</tbody></table></div>`;
    document.getElementById('tgt-daily-wrap').innerHTML=html;
  }

  el.innerHTML=`${tabBanner(1)}
  ${buildAnnHtml()}

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="card-title" style="margin:0;">📋 일별 매출 목표 · 실적 <span style="font-size:13px;color:#222;font-weight:400">(단위: 원)</span></div>
        <button id="tgt-day-toggle-btn" onclick="toggleTgtDays()" style="font-size:13px;padding:3px 10px;border:1px solid #8b6f5e;border-radius:5px;background:#8b6f5e;color:#fff;cursor:pointer;white-space:nowrap;">📅 일자별 상세 보기 ▼</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${availMons.map(m=>`<button class="pill ${window.tgtSt.mon===m?'active':''}" onclick="window.tgtSt.mon='${m}';renderTabTarget()">${m}</button>`).join('')}

    </div>
    <div id="tgt-daily-wrap"></div>
  </div>`;

  renderDailyTgt();
}

// ── 프로모션 메모 시스템 ──
var MEMO_PIN='1111'; // MD 수정 비밀번호
var MEMO_UNLOCKED=false;

// localStorage에서 메모 로드
function memoLoad(){
  try{return JSON.parse(localStorage.getItem('sinoon_promo_memos')||'{}');}
  catch(e){return{};}
}
function memoSave(store){
  try{localStorage.setItem('sinoon_promo_memos',JSON.stringify(store));}catch(e){}
}
function memoKey(p){return p.ch+'||'+p.name+'||'+p.period;}

// PIN 확인 모달
function memoUnlock(cb){
  if(MEMO_UNLOCKED){cb();return;}
  var pin=prompt('MD 수정 비밀번호를 입력하세요:');
  if(pin===MEMO_PIN){MEMO_UNLOCKED=true;cb();}
  else if(pin!==null){alert('비밀번호가 올바르지 않습니다.');}
}

// 메모 수정 모드 진입
function promoEditMode(idx){
  memoUnlock(function(){
    var disp=document.getElementById('pmemo-disp-'+idx);
    var editArea=document.getElementById('pmemo-edit-'+idx);
    var editBtn=document.getElementById('pmemo-editbtn-'+idx);
    if(disp)disp.style.display='none';
    if(editArea)editArea.style.display='block';
    if(editBtn)editBtn.style.display='none';
  });
}

// 메모 저장
function promoSaveMemo(idx){
  var ta=document.getElementById('pmemo-ta-'+idx);
  var disp=document.getElementById('pmemo-disp-'+idx);
  var editArea=document.getElementById('pmemo-edit-'+idx);
  var editBtn=document.getElementById('pmemo-editbtn-'+idx);
  if(!ta)return;
  var val=ta.value.trim();
  var key=ta.dataset.key;
  // localStorage 저장
  var store=memoLoad();
  store[key]=val;
  memoSave(store);
  try{jsonbinSave();}catch(e){} // Firebase 동기화
  // PROMO_DATA 메모 업데이트 (인메모리)
  for(var i=0;i<PROMO_DATA.length;i++){
    if(memoKey(PROMO_DATA[i])===key){PROMO_DATA[i].memo=val;break;}
  }
  // 화면 업데이트
  if(disp){
    disp.innerHTML=val
      ?val.replace(/\n/g,'<br>')
      :'<span style="color:#444;font-size:13px;">메모 없음</span>';
    disp.style.display='block';
  }
  if(editArea)editArea.style.display='none';
  if(editBtn)editBtn.style.display='inline-flex';
  // 저장 확인 토스트
  var toast=document.createElement('div');
  toast.textContent='저장완료 ✓';
  toast.style.cssText='position:fixed;bottom:30px;right:30px;background:#2c2c2c;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:1;transition:opacity 0.5s';
  document.body.appendChild(toast);
  setTimeout(function(){toast.style.opacity='0';setTimeout(function(){toast.remove();},500);},1800);
}

// 메모 취소
function promoCancelMemo(idx){

function buildDonut(){
  destroyChart('c0donut');
  const g=s0.donutGran;
  const chs=s0.donutChs.length?s0.donutChs:CH_NAMES;
  let nets;
  if(g==='연간'){
    nets=chs.map(ch=>Math.max(0,MONTHS.reduce((a,m)=>a+m26s(m,ch),0)-MONTHS.reduce((a,m)=>a+m26r(m,ch),0)));
  } else if(g==='월별'){
    const m=s0.donutSelMon||CUR_MON;
    nets=chs.map(ch=>Math.max(0,m26s(m,ch)-m26r(m,ch)));
  } else {
    const w=s0.donutSelWk||(D.month_to_weeks[s0.donutSelMon||CUR_MON]||[]).slice(-1)[0]||'';
    nets=chs.map(ch=>Math.max(0,(D.weekly26[w]?D.weekly26[w][ch]?D.weekly26[w][ch].s||0:0:0)-(D.weekly26[w]?D.weekly26[w][ch]?D.weekly26[w][ch].r||0:0:0)));
  }
  const total=nets.reduce((a,b)=>a+b,0);
  const donutPctPlugin={
    id:'donutPct',
    afterDatasetsDraw(chart){
      const {ctx,data}=chart;
      const meta=chart.getDatasetMeta(0);
      const tot=data.datasets[0].data.reduce((a,b)=>a+(b||0),0);
      meta.data.forEach((arc,i)=>{
        const val=data.datasets[0].data[i]||0;
        const pct=tot?(val/tot*100):0;
        if(pct<3)return;
        const pos=arc.tooltipPosition(false);
        ctx.save();
        ctx.fillStyle='#fff';
        ctx.font='bold 11px sans-serif';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.shadowColor='rgba(0,0,0,.3)';
        ctx.shadowBlur=3;
        ctx.fillText(pct.toFixed(1)+'%',pos.x,pos.y);
        ctx.restore();
      });
    }
  };
  chartInstances['c0donut']=new Chart(document.getElementById('c0donut'),{
    type:'doughnut',
    data:{
      labels:chs,
      datasets:[{
        data:nets,
        backgroundColor:chs.map(c=>CH_COLORS[c]),
        borderWidth:2,
        borderColor:'#fff'
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{position:'right',labels:{font:{size:11},padding:10}},
        tooltip:{callbacks:{label:function(ctx){return ' '+won(ctx.raw)+' ('+(total?(ctx.raw/total*100).toFixed(1):0)+'%)';}}}
      }
    },
    plugins:[donutPctPlugin]
  });
}

function s0GetData(ch){
  const g=s0.gran;let s26=0,s25=0,tgt=0;
  if(g==='월별'){
    const sel=s0.selMonths.length?s0.selMonths:MONTHS;
    sel.forEach(m=>{
      const v26=D.monthly26[m]?D.monthly26[m][ch]||{}:{};
      s26+=(v26.s||0)-(v26.r||0);
      if(hasMon(m)){s25+=m25s(m,ch);tgt+=D.targets[ch]?D.targets[ch][m]||0:0;}
    });
  } else if(g==='주차별'){
    const sel=s0.selWeeks.length?s0.selWeeks:D.month_to_weeks[s0.wkMon]||[];
    sel.forEach(w=>{
      const wDates=D.week_to_dates[w]||[];
      wDates.forEach(d=>{
        const v=D.daily26[d]?D.daily26[d][ch]||{}:{};
        s26+=(v.s||0)-(v.r||0);
        if(hasData(d)){s25+=sv(D.daily25[d.replace('2026','2025')],ch)||0;}
      });
      if(hasWeek(w)){tgt+=D.weekly_target[w]?D.weekly_target[w][ch]||0:0;}
    });
  } else {
    const sel=s0.selDays.length?s0.selDays:D.month_to_dates[CUR_MON]||[];
    sel.forEach(d=>{
      const v=D.daily26[d]?D.daily26[d][ch]||{}:{};
      s26+=(v.s||0)-(v.r||0);
      if(hasData(d)){s25+=sv(D.daily25[d.replace('2026','2025')],ch)||0;tgt+=D.daily_target[d]?D.daily_target[d][ch]||0:0;}
    });
  }
  return{s26,s25,tgt};
}

function s1_gran(g){
  if(g==='월별'){
    const lastMon=CUR_MON;
    if(s1.gran==='월별'&&s1.selMonths.length===1&&s1.selMonths[0]===lastMon){
      // 금월 → 전체 월
      s1.selMonths=[...MONTHS];
    } else if(s1.gran==='월별'&&s1.selMonths.length===MONTHS.length){
      // 전체 월 → 금월
      s1.selMonths=[lastMon];
    } else {
      // 다른 탭에서 월별 클릭 → 금월 기본
      s1.selMonths=[lastMon];
    }
  } else if(g==='주차별'){
    let lastMon=CUR_MON;
    let wks=D.month_to_weeks[lastMon]||[];
    if(!wks.length){const fb=MONTHS.slice().reverse().find(m=>(D.month_to_weeks[m]||[]).length>0);if(fb){lastMon=fb;wks=D.month_to_weeks[fb]||[];}}
    s1.wkMon=lastMon;s1.selWeeks=wks.length?[wks[wks.length-1]]:[];
  } else {
    let lastMon=CUR_MON;
    let ds=D.month_to_dates[lastMon]||[];
    if(!ds.length){const fb=MONTHS.slice().reverse().find(m=>(D.month_to_dates[m]||[]).length>0);if(fb){lastMon=fb;ds=D.month_to_dates[fb]||[];}}
    s1.dyMon=lastMon;
    s1.selDays=ds.length?[ds[ds.length-1]]:[];
  }
  s1.gran=g;
  renderTab1();
}
function s1_allCh(){s1.selChs=[...VISIBLE_CHS];renderTab1();}
function s1_tCh(ch){const a=s1.selChs,i=a.indexOf(ch);if(i>=0)a.splice(i,1);else a.push(ch);if(!a.length)a.push(ch);renderTab1();}
function s1PF(){
  const el=document.getElementById('s1pf');if(!el)return;
  const g=s1.gran;
  if(g==='월별'){el.innerHTML='<div class="filter-row"><span class="filter-label">월:</span>'+MONTHS.filter(m=>hasMon(m)).map(m=>`<button class="pill ${s1.selMonths.includes(m)?'active':''}" onclick="s1_tM('${m}')">${m}</button>`).join('')+'</div>';}
  else if(g==='주차별'){const wks=D.month_to_weeks[s1.wkMon]||[];el.innerHTML='<div class="filter-row"><span class="filter-label">월:</span>'+MONTHS.filter(m=>(D.month_to_weeks[m]||[]).length>0).map(m=>`<button class="pill ${s1.wkMon===m?'active':''}" onclick="s1_wkMon('${m}')">${m}</button>`).join('')+'</div><div class="filter-row"><span class="filter-label">주차:</span>'+wks.map(w=>`<button class="pill ${s1.selWeeks.includes(w)?'active':''}" onclick="s1_tW('${w}')">${wkLabel(w)}</button>`).join('')+'</div>';}
  else{const availMons=MONTHS.filter(m=>(D.month_to_dates[m]||[]).some(d=>hasData(d)));const ds=(D.month_to_dates[s1.dyMon]||[]).filter(d=>hasData(d));el.innerHTML='<div class="filter-row" style="width:100%"><span class="filter-label">월:</span>'+availMons.map(m=>{const hasSel=(D.month_to_dates[m]||[]).some(d=>s1.selDays.includes(d));return`<button class="pill ${s1.dyMon===m?'active':''}" onclick="s1_dyMon('${m}')" style="${hasSel?'position:relative;':''}">${m}${hasSel?'<span style="position:absolute;top:2px;right:3px;width:5px;height:5px;background:#e74c3c;border-radius:50%;display:inline-block;"></span>':''}</button>`;}).join('')+'</div><div class="filter-row" style="width:100%"><span class="filter-label">일:</span>'+ds.map(d=>`<button class="pill ${s1.selDays.includes(d)?'active':''}" onclick="s1_tD('${d}')">${d.slice(8)}일</button>`).join('')+'</div>';}
}
function s1_tM(m){const a=s1.selMonths,i=a.indexOf(m);i>=0?a.splice(i,1):a.push(m);s1PF();s1Table();s1Charts();}
function s1_wkMon(m){s1.wkMon=m;s1.selWeeks=[];s1PF();s1Table();s1Charts();}
function s1_tW(w){const a=s1.selWeeks,i=a.indexOf(w);i>=0?a.splice(i,1):a.push(w);s1PF();s1Table();s1Charts();}
function s1_dyMon(m){s1.dyMon=m;s1PF();s1Table();s1Charts();}
function s1_tD(d){const a=s1.selDays,i=a.indexOf(d);i>=0?a.splice(i,1):a.push(d);s1PF();s1Table();s1Charts();}

function s1Periods(){
  const g=s1.gran;
  if(g==='월별'){const sel=s1.selMonths.length?s1.selMonths:MONTHS;return MONTHS.filter(m=>sel.includes(m));}
  if(g==='주차별'){const sel=s1.selWeeks.length?s1.selWeeks:(D.month_to_weeks[s1.wkMon]||[]);return D.weeks.filter(w=>sel.includes(w));}
  const sel=s1.selDays.length?s1.selDays:(D.month_to_dates[CUR_MON]||[]);return D.dates.filter(d=>sel.includes(d));
}

function s1D(p,ch){
  const g=s1.gran;let s26=0,r26=0,s25=0,tgt=0,sq=0,rq=0;
  if(g==='월별'){s26=m26s(p,ch);r26=m26r(p,ch);sq=sv(D.monthly26[p],ch,'q');rq=sv(D.monthly26[p],ch,'rq');if(hasMon(p)){s25=m25s(p,ch);tgt=D.targets[ch]?D.targets[ch][p]||0:0;}}
  else if(g==='주차별'){s26=sv(D.weekly26[p],ch,'s');r26=sv(D.weekly26[p],ch,'r');sq=sv(D.weekly26[p],ch,'q');rq=sv(D.weekly26[p],ch,'rq');if(hasWeek(p)){s25=_weekly_yoy_same_period(p,ch);tgt=D.weekly_target[p]?D.weekly_target[p][ch]||0:0;}}
  else{s26=sv(D.daily26[p],ch,'s');r26=sv(D.daily26[p],ch,'r');sq=sv(D.daily26[p],ch,'q');rq=sv(D.daily26[p],ch,'rq');if(hasData(p)){s25=sv(D.daily25[p.replace('2026','2025')],ch)||0;tgt=D.daily_target[p]?D.daily_target[p][ch]||0:0;}}
  return{s26,r26,net:s26-r26,s25,tgt,sq,rq};
}

function s1Table(){
  const wrap=document.getElementById('s1tbl');if(!wrap)return;
  const ctrl=document.getElementById('s1colCtrl');
  const periods=s1Periods();
  const baseChs=s1.selChs.length?s1.selChs:VISIBLE_CHS;
  const chs=s1.showNugu?[...baseChs,...(baseChs.includes('NUGU_일본')?[]:['NUGU_일본'])]:baseChs.filter(c=>c!=='NUGU_일본');

  // ── 컬럼 정의 ──
  const wowLabel=s1.gran==='월별'?'전월 대비 신장률':s1.gran==='일별'?'전일 대비 신장률':'전주 대비 신장률';
  const ALL_COLS=[
    {key:'tgt',   label:'목표'},
    {key:'net',   label:'순매출'},
    {key:'ach',   label:'달성률'},
    {key:'share', label:'비중'},
    {key:'wow',   label:wowLabel},
    {key:'yoy',   label:'전년동기 신장률'},
    {key:'sq',    label:'판매수량'},
    {key:'rq',    label:'반품수량'},
    {key:'sgross',label:'판매금액'},
    {key:'rgross',label:'반품금액'},
    {key:'s25',   label:'25년실적'},
    {key:'retrate',label:'반품률'},
  ];
  // ── 컬럼 드롭다운 렌더 ──
  s1RenderColCtrl(ALL_COLS);

  if(!periods.length){wrap.innerHTML='<p style="padding:16px;color:var(--sub)">기간을 선택하세요</p>';return;}

  const visCols=s1ColOrder.map(i=>({...ALL_COLS[i],origIdx:i})).filter(c=>s1ColVis[c.origIdx]);
  const NC=visCols.length||1;
  const allPeriods=[...periods,'합계'];

  // ── 이전 기간 조회 (WoW/전월대비) ──
  const periodArr=s1.gran==='월별'?D.months:s1.gran==='주차별'?D.weeks:D.dates;
  function prevPeriod(p){if(p==='합계')return null;const idx=periodArr?periodArr.indexOf(p):-1;return idx>0?periodArr[idx-1]:null;}

  // ── 신장률 HTML 포맷 ──
  function fmtGrowth(cur,base){
    if(!base||base===0)return '<span style="color:#111">-</span>';
    const pct=(cur-base)/Math.abs(base)*100;
    const color=pct>=0?'#1e7a4a':'#c0392b';
    const arrow=pct>=0?'▲':'▼';
    return `<span style="color:${color};font-weight:600">${arrow}${Math.abs(pct).toFixed(1)}%</span>`;
  }

  // ── 1차: 전체 데이터 집계 ──
  const chData={};
  const periodTotals={};
  allPeriods.forEach(p=>{periodTotals[p]={tgt:0,net:0,s25:0,sq:0,rq:0,s26:0,r26:0};});

  chs.forEach(ch=>{
    chData[ch]={};
    let sumS=0,sumR=0,sumTgt=0,sumS25=0;
    let sumSq=0,sumRq=0;
    periods.forEach(p=>{
      const{s26,r26,net,tgt,s25,sq,rq}=s1D(p,ch);
      chData[ch][p]={net,tgt,s25,sq,rq,s26,r26};
      sumS+=s26;sumR+=r26;sumTgt+=tgt;sumS25+=s25;sumSq+=sq;sumRq+=rq;
      periodTotals[p].net+=net;periodTotals[p].tgt+=tgt;periodTotals[p].s25+=s25;
      periodTotals[p].sq+=sq;periodTotals[p].rq+=rq;
      periodTotals[p].s26+=s26;periodTotals[p].r26+=r26;
    });
    const sumNet=sumS-sumR;
    chData[ch]['합계']={net:sumNet,tgt:sumTgt,s25:sumS25,sq:sumSq,rq:sumRq,s26:sumS,r26:sumR};
    periodTotals['합계'].net+=sumNet;periodTotals['합계'].tgt+=sumTgt;periodTotals['합계'].s25+=sumS25;
    periodTotals['합계'].sq=(periodTotals['합계'].sq||0)+sumSq;periodTotals['합계'].rq=(periodTotals['합계'].rq||0)+sumRq;
    periodTotals['합계'].s26=(periodTotals['합계'].s26||0)+sumS;periodTotals['합계'].r26=(periodTotals['합계'].r26||0)+sumR;
  });

  // ── 헤더 ──
  // ── 모든 서브헤더: 블랙배경+화이트볼드 ──
  const subThStyle=(label,isSum)=>{
    const bg=isSum?'#2a2a2a':'#111';
    return `background:${bg};color:#fff;font-weight:700;white-space:nowrap;font-size:13px;`;
  };
  // 1행: 빈 채널칸 + 기간 그룹헤더
  let thead=`<thead><tr><th style="background:#2d2926;color:#2d2926;border:none;">　</th>`;
  periods.forEach(p=>{
    const pLabel=s1.gran==='주차별'?wkLabel(p):s1.gran==='일별'?p.slice(5).replace('-','/'):p;
    thead+=`<th colspan="${NC}" style="text-align:center;border-left:2px solid #555;font-size:14px;font-weight:700;letter-spacing:0.04em;">${pLabel}</th>`;
  });
  thead+=`<th colspan="${NC}" style="text-align:center;border-left:3px solid #777;font-size:14px;font-weight:700;">합계</th></tr>`;
  // 2행: 채널 + 서브헤더
  thead+=`<tr><th style="text-align:left;padding-left:14px;background:#1e1c1a;color:#f0ece7;font-size:13px;font-weight:700;">채널</th>`;
  allPeriods.forEach((p,pi)=>{
    const isSum=pi===allPeriods.length-1;
    visCols.forEach(c=>{thead+=`<th style="${subThStyle(c.label,isSum)}border-left:${c===visCols[0]?(isSum?'3px solid #777':'2px solid #555'):'none'};">${c.label}</th>`;});
  });
  thead+=`</tr></thead>`;

  // ── 채널별 행 ──
  let rows='';
  chs.forEach(ch=>{
    let row=`<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CH_COLORS[ch]};margin-right:5px"></span>${dn(ch)}</td>`;
    allPeriods.forEach((p,pi)=>{
      const d=chData[ch][p];
      const net=d.net,tgt=d.tgt,s25=d.s25;
      const ach=tgt?(net/tgt*100).toFixed(1)+'%':'-';
      const ptNet=periodTotals[p].net;
      const share=ptNet?(net/ptNet*100).toFixed(1)+'%':'-';
      const prev=prevPeriod(p);
      let prevNet=0;
      if(prev){
        if(s1.gran==='월별'&&_isIncompleteMon(p)){prevNet=_mom_same_period_net(p,ch);}
        else{const pd=s1D(prev,ch);prevNet=pd.net;}
      }
      const wowHtml=p!=='합계'&&prev?fmtGrowth(net,prevNet):'<span style="color:#111">-</span>';
      const yoyHtml=fmtGrowth(net,s25);
      const sc=pi===allPeriods.length-1?' class="sum-col"':'';
      const sq=d.sq||0,rq=d.rq||0,s26v=d.s26||0,r26v=d.r26||0;
      const cellMap={
        tgt:`<td${sc}>${won(tgt)}</td>`,
        net:`<td${sc} style="font-weight:700;color:#c0392b">${won(net)}</td>`,
        ach:(()=>{
          const achNum=tgt?(net/tgt*100):null;
          let achBg='',achFc='#111',achFw='600';
          if(achNum!==null){
            if(achNum>=100){achBg='background:#d4edda;';achFc='#1e7a4a';}
            else if(achNum>=70){achBg='background:#fff3cd;';achFc='#856404';}
            else if(achNum>=40){achBg='background:#ffe0b2;';achFc='#e65100';}
            else{achBg='background:#fde8e8;';achFc='#c0392b';}
          }
          return `<td${sc} style="${achBg}color:${achFc};font-weight:${achFw};text-align:center;">${ach}</td>`;
        })(),
        share:`<td${sc} style="color:#2980b9;font-weight:600">${share}</td>`,
        wow:`<td${sc}>${wowHtml}</td>`,
        yoy:`<td${sc}>${yoyHtml}</td>`,
        sq:`<td${sc}>${sq.toLocaleString()}개</td>`,
        rq:`<td${sc} style="color:#c0392b">${rq.toLocaleString()}개</td>`,
        sgross:`<td${sc}>${won(s26v)}</td>`,
        rgross:`<td${sc} style="color:#c0392b">${won(r26v)}</td>`,
        s25:`<td${sc} style="color:#111">${s25?won(s25):'-'}</td>`,
        retrate:`<td${sc} style="color:${s26v?(r26v/s26v*100)>20?'#c0392b':(r26v/s26v*100)>10?'#d4830a':'#555':'#aaa'}">${s26v?(r26v/s26v*100).toFixed(1)+'%':'-'}</td>`,
      };
      visCols.forEach(c=>{row+=cellMap[c.key];});
    });
    row+=`</tr>`;rows+=row;
  });

  // ── 합계 행 ──
  let trow=`<tr style="font-weight:700;background:#f0ede8"><td>합계</td>`;
  allPeriods.forEach((p,pi)=>{
    const t=periodTotals[p];
    const ach=t.tgt?(t.net/t.tgt*100).toFixed(1)+'%':'-';
    const prev=prevPeriod(p);
    let prevTotalNet=0;
    if(prev){
      if(s1.gran==='월별'&&_isIncompleteMon(p)){chs.forEach(ch2=>{prevTotalNet+=_mom_same_period_net(p,ch2);});}
      else{chs.forEach(ch2=>{const pd=s1D(prev,ch2);prevTotalNet+=pd.net;});}
    }
    const wowHtml=p!=='합계'&&prev?fmtGrowth(t.net,prevTotalNet):'<span style="color:#111">-</span>';
    const yoyHtml=fmtGrowth(t.net,t.s25);
    const sc=pi===allPeriods.length-1?' class="sum-col"':'';
    const tsq=t.sq||0,trq=t.rq||0,ts26=t.s26||0,tr26=t.r26||0;
    const cellMap={
      tgt:`<td${sc}>${won(t.tgt)}</td>`,
      net:`<td${sc} style="font-weight:700;color:#c0392b">${won(t.net)}</td>`,
      ach:(()=>{
          const achNum=t.tgt?(t.net/t.tgt*100):null;
          let achBg='',achFc='#111',achFw='600';
          if(achNum!==null){
            if(achNum>=100){achBg='background:#d4edda;';achFc='#1e7a4a';}
            else if(achNum>=70){achBg='background:#fff3cd;';achFc='#856404';}
            else if(achNum>=40){achBg='background:#ffe0b2;';achFc='#e65100';}
            else{achBg='background:#fde8e8;';achFc='#c0392b';}
          }
          return `<td${sc} style="${achBg}color:${achFc};font-weight:${achFw};text-align:center;">${ach}</td>`;
        })(),
      share:`<td${sc} style="color:#2980b9;font-weight:600">100%</td>`,
      wow:`<td${sc}>${wowHtml}</td>`,
      yoy:`<td${sc}>${yoyHtml}</td>`,
      sq:`<td${sc}>${tsq.toLocaleString()}개</td>`,
      rq:`<td${sc} style="color:#c0392b">${trq.toLocaleString()}개</td>`,
      sgross:`<td${sc}>${won(ts26)}</td>`,
      rgross:`<td${sc} style="color:#c0392b">${won(tr26)}</td>`,
      s25:`<td${sc} style="color:#111">${t.s25?won(t.s25):'-'}</td>`,
      retrate:`<td${sc} style="color:${ts26?(tr26/ts26*100)>20?'#c0392b':(tr26/ts26*100)>10?'#d4830a':'#555':'#aaa'}">${ts26?(tr26/ts26*100).toFixed(1)+'%':'-'}</td>`,
    };
    visCols.forEach(c=>{trow+=cellMap[c.key];});
  });
  trow+=`</tr>`;

  wrap.innerHTML=`<table class="s1-chan-tbl">${thead}<tbody>${rows}${trow}</tbody></table>`;
}

function s1Charts(){
  const periods=s1Periods();
  const _baseChs2=s1.selChs.length?s1.selChs:VISIBLE_CHS;
  const chs=s1.showNugu?[..._baseChs2,...(_baseChs2.includes('NUGU_일본')?[]:['NUGU_일본'])]:_baseChs2.filter(c=>c!=='NUGU_일본');
  const retLabels=[],retData=[],retSales=[],retReturns=[],yoyLabels=[],yoyData=[];
  // 채널별 누적 집계 (선택 기간 합산)
  chs.forEach(ch=>{
    let totS=0,totR=0,totS25=0;
    periods.forEach(p=>{const d=s1D(p,ch);totS+=d.s26;totR+=d.r26;totS25+=d.s25;});
    retLabels.push(ch);
    retSales.push(totS);
    retReturns.push(totR);
    retData.push(totS?parseFloat((totR/totS*100).toFixed(1)):0);
    yoyLabels.push(ch);
    yoyData.push(totS25?parseFloat(((totS-totS25)/totS25*100).toFixed(1)):null);
  });

  // 누적 반품률 — HTML 게이지 바 (가로 프로그레스 형태)
  const re=document.getElementById('s1ret');
  if(re){
    // 전채널 가중 평균 계산
    const allS=retSales.reduce((a,b)=>a+b,0);
    const allR=retReturns.reduce((a,b)=>a+b,0);
    const avgRate=allS?parseFloat((allR/allS*100).toFixed(1)):0;
    const maxV=Math.max(...retData,avgRate,25);

    function _gaugeRow(label,v,isTotal){
      const pct=Math.min((v/maxV)*100,100).toFixed(1);
      const col=v>20?'#c0392b':v>15?'#d4830a':'#1e7a4a';
      const bg=v>20?'#fdecea':v>15?'#fff3e0':'#e8f5e9';
      const grade=v>20?'위험':v>15?'주의':'양호';
      const barH=isTotal?'13px':'10px';
      const nameSz=isTotal?'14px':'13px';
      const valSz=isTotal?'15px':'14px';
      const badgeSz=isTotal?'11px':'10px';
      const mb=isTotal?'0':'6px';
      const fw=isTotal?'800':'600';
      const rowBg=isTotal?'#f7f5f2':'#fff';
      const borderStyle=isTotal?'border-left:4px dashed '+col+';':'border-left:4px solid '+col+';';
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:'+mb+';padding:7px 10px;border-radius:6px;background:'+rowBg+';'+borderStyle+'">'
        +'<div style="font-size:'+nameSz+';font-weight:'+fw+';width:88px;flex-shrink:0;color:'+(isTotal?'#2d2926':col)+';">'+label+'</div>'
        +'<div style="flex:1;background:#f0eeec;border-radius:99px;height:'+barH+';overflow:hidden;">'
        +'<div style="width:'+pct+'%;height:100%;background:'+col+';border-radius:99px;transition:width .4s;opacity:'+(isTotal?'0.75':'0.65')+'"></div>'
        +'</div>'
        +'<div style="font-size:'+valSz+';font-weight:700;width:44px;text-align:right;color:'+col+';">'+v+'%</div>'
        +'<div style="font-size:'+badgeSz+';padding:2px 7px;border-radius:4px;background:'+bg+';color:'+col+';font-weight:700;min-width:36px;text-align:center;">'+grade+'</div>'
        +'</div>';
    }

    re.innerHTML='<div style="padding:4px 0;">'
      +retLabels.map((ch,i)=>_gaugeRow(dn(ch),retData[i],false)).join('')
      +'<div style="border-top:1px solid #e0dbd5;margin:10px 0 8px;"></div>'
      +_gaugeRow('전채널 평균',avgRate,true)
      +'<div style="font-size:10px;color:#bbb;margin-top:8px;line-height:1.5;">✦ 20% 초과 위험 · 15~20% 주의 · 15% 미만 양호<br>전채널 평균: 판매금액 기준 가중 평균</div>'
      +'</div>';
  }
  destroyChart('s1yoy');
  const ye=document.getElementById('s1yoy');

function s2GetCurWeek(){
  // D.week_to_dates 기준 오늘 날짜가 속한 주차 반환
  const today=new Date().toISOString().slice(0,10);
  const weeks=D.weeks||[];
  for(let i=weeks.length-1;i>=0;i--){
    const dates=(D.week_to_dates||{})[weeks[i]]||[];
    if(dates.length&&dates[0]<=today)return weeks[i];
  }
  // 폴백: week_to_dates에 현재 월 데이터 없는 경우 → 현재 월의 마지막 주차 반환
  const curM=(new Date().getMonth()+1)+'월';
  const curMonWks=weeks.filter(w=>w.startsWith(curM));
  if(curMonWks.length)return curMonWks[curMonWks.length-1];
  return weeks[weeks.length-1]||'';
}

  if(parts.length)return parts.join(' + ');
  if(s2.gran==='월별') return s2.selMon||(D.months[D.months.length-1]);
  if(s2.gran==='주차별') return s2.selWk||(D.weeks[D.weeks.length-1]);
  return '연간';
}

function s2GetTop(){
  const map={};
  if(s2._monAllOff&&!(s2.wkFilter&&s2.wkFilter.length))return [];// 기간 전체 해제 시 빈 결과
  const targetMons=(s2.monFilter&&s2.monFilter.length)?s2.monFilter:null;
  const targetWks=(s2.wkFilter&&s2.wkFilter.length)?s2.wkFilter:null;
  const hasFilter=targetMons||targetWks;
  function addP(p){
    // 10자 이하 코드 + 이름에 컬러명 있으면 12자 코드로 확장
    let code=p.code;
    if(code.length<=10&&p.name){
      const _ckm={'Indie Pink':'IP','Black':'BK','White':'WH','Beige':'BE','Cyan':'CY','Pink':'PK','Ivory':'IV','Lilac':'LC','Grey':'GR','Khaki':'KK','Navy':'NV','Cream':'CR','Brown':'BR','Mint':'MT','Camel':'CM','Yellow':'YL','Red':'RD','Blue':'BL','Green':'GN','Orange':'OG'};
      for(const [kw,sf] of Object.entries(_ckm)){if(p.name.includes(kw)){const fc=code+sf;if(STOCK_MAP[fc]!==undefined||IMG_MAP[fc]){code=fc;break;}}}
    }
    const stk=STOCK_MAP[code]??p.stock??0;const cst=COST_MAP[code]??p.cost??0;
    // ps_data에서 season/item 보완 (month_ranking/week_ranking엔 비어있는 경우)
    const _psd=D.ps_data&&(D.ps_data[code]||D.ps_data[p.code]);
    const _item=p.item||(_psd&&_psd.item)||'';
    const _season=p.season||(_psd&&_psd.season)||'';
    const _co=p.co||(_psd&&_psd.co)||'';
    if(!map[code])map[code]={code,item:_item,name:p.name,season:_season,co:_co,s:0,r:0,q:0,rq:0,cost:cst,stock:stk};
    else{if(!map[code].item&&_item)map[code].item=_item;if(!map[code].season&&_season)map[code].season=_season;if(!map[code].co&&_co)map[code].co=_co;}
    map[code].s+=p.s||0;map[code].r+=p.r||0;map[code].q+=p.q||0;map[code].rq+=p.rq||0;
  }
  // 전체(연간): ps_data 직접 사용 (month_ranking TOP15 제한 우회 → 정확도 향상)
  if(!hasFilter){
    const isAllCh=VISIBLE_CHS.every(ch=>s2.selChs.includes(ch));
    if(D.ps_data){
      Object.entries(D.ps_data).forEach(([code,p])=>{
        if(isAllCh){
          if(!p.q&&!p.s)return;
          addP({code,name:p.name,s:p.s||0,q:p.q||0,r:p.r||0,rq:p.rq||0,item:p.item||'',season:p.season||'',cost:p.cost||0,stock:p.stock||0});
        } else {
          let ts=0,tq=0,tr=0,trq=0;
          s2.selChs.forEach(ch=>{const bc=p.by_ch&&p.by_ch[ch];if(bc){ts+=bc.s||0;tq+=bc.q||0;tr+=bc.r||0;trq+=bc.rq||0;}});
          if(ts||tq)addP({code,name:p.name,s:ts,q:tq,r:tr,rq:trq,item:p.item||'',season:p.season||'',cost:p.cost||0,stock:p.stock||0});
        }
      });
    } else {
      // ps_data 없으면 month_ranking 폴백
      s2.selChs.forEach(ch=>{
        (D.months||[]).forEach(m=>{
          ((D.month_ranking&&D.month_ranking[m]&&D.month_ranking[m][ch])||[]).forEach(addP);
        });
      });
    }
  }
  // 주차 필터
  if(targetWks){
    const isAllCh=VISIBLE_CHS.every(ch=>s2.selChs.includes(ch));
    if(isAllCh&&D.ps_data){
      Object.entries(D.ps_data).forEach(([code,p])=>{
        const bwArr=targetWks.map(w=>p.by_wk&&p.by_wk[w]).filter(Boolean);
        if(!bwArr.length)return;
        const agg={s:0,q:0,r:0,rq:0};
        bwArr.forEach(bw=>{agg.s+=bw.s||0;agg.q+=bw.q||0;agg.r+=bw.r||0;agg.rq+=bw.rq||0;});
        if(!agg.s&&!agg.q)return;
        addP({code,name:p.name,s:agg.s,q:agg.q,r:agg.r,rq:agg.rq,item:p.item||'',season:p.season||'',cost:p.cost||0,stock:p.stock||0});
      });
    } else {
      // 특정 채널: week_ranking[w][ch] → 없으면 ps_data.by_wk+by_ch 폴백
      const chMap={};
      targetWks.forEach(w=>{
        s2.selChs.forEach(ch=>{
          const arr=(D.week_ranking&&D.week_ranking[w]&&D.week_ranking[w][ch])||[];
          arr.forEach(p=>{
            if(!chMap[p.code])chMap[p.code]={code:p.code,name:p.name,s:0,q:0,r:0,rq:0,item:'',season:'',cost:0,stock:0};
            chMap[p.code].s+=p.s||0;chMap[p.code].q+=p.q||0;chMap[p.code].r+=p.r||0;chMap[p.code].rq+=p.rq||0;
            const _psd=D.ps_data&&D.ps_data[p.code];
            if(_psd){chMap[p.code].item=_psd.item||'';chMap[p.code].season=_psd.season||'';chMap[p.code].cost=_psd.cost||0;chMap[p.code].stock=_psd.stock||0;}
          });
        });
      });
      if(Object.keys(chMap).length){
        Object.values(chMap).forEach(addP);
      }else if(D.ps_data){
        // week_ranking 없으면 by_wk 폴백
        Object.entries(D.ps_data).forEach(([code,p])=>{
          const agg={s:0,q:0,r:0,rq:0};
          let hasData=false;
          targetWks.forEach(w=>{const bw=p.by_wk&&p.by_wk[w];if(bw){agg.s+=bw.s||0;agg.q+=bw.q||0;agg.r+=bw.r||0;agg.rq+=bw.rq||0;hasData=true;}});
          if(!hasData||(!agg.s&&!agg.q))return;
          addP({code,name:p.name,s:agg.s,q:agg.q,r:agg.r,rq:agg.rq,item:p.item||'',season:p.season||'',cost:p.cost||0,stock:p.stock||0});
        });
      }
    }
  }
  // 월 필터
  if(targetMons){
    const isAllCh=VISIBLE_CHS.every(ch=>s2.selChs.includes(ch));
    if(isAllCh&&D.ps_data){
      // 전체 채널: ps_data.by_mon 사용
      targetMons.forEach(m=>{
        Object.entries(D.ps_data).forEach(([code,p])=>{
          const bm=p.by_mon&&p.by_mon[m];
          if(!bm||(!bm.s&&!bm.q))return;
          addP({code,name:p.name,s:bm.s||0,q:bm.q||0,r:bm.r||0,rq:bm.rq||0,item:p.item||'',season:p.season||'',cost:p.cost||0,stock:p.stock||0});
        });
      });
    } else {
      // 특정 채널: month_ranking[m][ch] — 채널별 정확한 데이터
      targetMons.forEach(m=>{
        const chMap={};
        s2.selChs.forEach(ch=>{
          const arr=(D.month_ranking&&D.month_ranking[m]&&D.month_ranking[m][ch])||[];
          arr.forEach(p=>{
            if(!chMap[p.code])chMap[p.code]={code:p.code,name:p.name,s:0,q:0,r:0,rq:0,item:'',season:'',cost:0,stock:0};
            chMap[p.code].s+=p.s||0;chMap[p.code].q+=p.q||0;chMap[p.code].r+=p.r||0;chMap[p.code].rq+=p.rq||0;
            const _psd=D.ps_data&&D.ps_data[p.code];
            if(_psd){chMap[p.code].item=_psd.item||'';chMap[p.code].season=_psd.season||'';chMap[p.code].cost=_psd.cost||0;chMap[p.code].stock=_psd.stock||0;}
          });
        });
        Object.values(chMap).forEach(addP);
      });
    }
  }
  let _res=Object.values(map);
  if(s2.selSeasons&&s2.selSeasons.length)_res=_res.filter(p=>s2.selSeasons.includes(PRODUCT_SEASON_MAP[p.code]||p.season||''));
  if(s2.selCats&&s2.selCats.length)_res=_res.filter(p=>s2.selCats.includes(p.item||''));
  return _res.sort((a,b)=>s2.topSort==='수량'?b.q-a.q:b.s-a.s).slice(0,100);
}

function s2GetRetSrc(ch){
  if(s2.gran==='월별'&&D.month_high_ret){
    const m=s2.selMon;
    if(D.month_high_ret[m])return D.month_high_ret[m][ch]||D.month_high_ret[m]['전체']||[];
  }
  if(s2.gran==='주차별'&&D.week_high_ret){
    const w=s2.selWk;
    if(D.week_high_ret[w])return D.week_high_ret[w][ch]||D.week_high_ret[w]['전체']||[];
  }
  return D.ch_high_ret[ch]||D.high_ret_all||[];
}

function s2GetRet(){
  const map={};
  if(s2._monAllOff&&!(s2.wkFilter&&s2.wkFilter.length))return [];
  const targetMons=(s2.monFilter&&s2.monFilter.length)?s2.monFilter:null;
  const targetWks=(s2.wkFilter&&s2.wkFilter.length)?s2.wkFilter:null;
  const hasFilter=targetMons||targetWks;
  function addP(p){
    const stk=STOCK_MAP[p.code]??p.stock??0;const cst=COST_MAP[p.code]??p.cost??0;
    if(!map[p.code])map[p.code]={code:p.code,item:p.item||'-',name:p.name,season:p.season||'',s:0,r:0,q:0,rq:0,rr:0,cost:cst,stock:stk};
    map[p.code].s+=p.s||0;map[p.code].r+=p.r||0;map[p.code].q+=p.q||0;map[p.code].rq+=p.rq||0;
  }
  // 전체(연간)
  if(!hasFilter){
    s2.selChs.forEach(ch=>{
      (D.months||[]).forEach(m=>{
        ((D.month_ranking&&D.month_ranking[m]&&D.month_ranking[m][ch])||[]).forEach(addP);
      });
    });
  }
  // 주차 필터
  if(targetWks){
    const isAllCh=VISIBLE_CHS.every(ch=>s2.selChs.includes(ch));
    if(isAllCh&&D.ps_data){
      Object.entries(D.ps_data).forEach(([code,p])=>{
        const bwArr=targetWks.map(w=>p.by_wk&&p.by_wk[w]).filter(Boolean);
        if(!bwArr.length)return;
        const agg={s:0,q:0,r:0,rq:0};
        bwArr.forEach(bw=>{agg.s+=bw.s||0;agg.q+=bw.q||0;agg.r+=bw.r||0;agg.rq+=bw.rq||0;});
        if(!agg.r)return;
        addP({code,name:p.name,s:agg.s,q:agg.q,r:agg.r,rq:agg.rq,item:p.item||'',season:p.season||'',cost:p.cost||0,stock:p.stock||0});
      });
    } else {
      // 특정 채널: week_ranking[w][ch] → 없으면 ps_data.by_wk+by_ch 폴백
      const chMap={};
      targetWks.forEach(w=>{
        s2.selChs.forEach(ch=>{
          const arr=(D.week_ranking&&D.week_ranking[w]&&D.week_ranking[w][ch])||[];
          arr.filter(p=>p.r).forEach(p=>{
            if(!chMap[p.code])chMap[p.code]={code:p.code,name:p.name,s:0,q:0,r:0,rq:0,item:'',season:'',cost:0,stock:0};
            chMap[p.code].s+=p.s||0;chMap[p.code].q+=p.q||0;chMap[p.code].r+=p.r||0;chMap[p.code].rq+=p.rq||0;
            const _psd=D.ps_data&&D.ps_data[p.code];
            if(_psd){chMap[p.code].item=_psd.item||'';chMap[p.code].season=_psd.season||'';chMap[p.code].cost=_psd.cost||0;chMap[p.code].stock=_psd.stock||0;}
          });
        });
      });
      if(Object.keys(chMap).length){
        Object.values(chMap).filter(p=>p.r>0).forEach(addP);
      }else if(D.ps_data){
        // week_ranking 없으면 by_wk 폴백
        Object.entries(D.ps_data).forEach(([code,p])=>{
          const agg={s:0,q:0,r:0,rq:0};
          let hasData=false;
          targetWks.forEach(w=>{const bw=p.by_wk&&p.by_wk[w];if(bw){agg.s+=bw.s||0;agg.q+=bw.q||0;agg.r+=bw.r||0;agg.rq+=bw.rq||0;hasData=true;}});
          if(!hasData||!agg.r)return;
          addP({code,name:p.name,s:agg.s,q:agg.q,r:agg.r,rq:agg.rq,item:p.item||'',season:p.season||'',cost:p.cost||0,stock:p.stock||0});
        });
      }
    }
  }
  // 월 필터
  if(targetMons){
    const isAllCh=VISIBLE_CHS.every(ch=>s2.selChs.includes(ch));
    if(isAllCh&&D.ps_data){
      targetMons.forEach(m=>{
        Object.entries(D.ps_data).forEach(([code,p])=>{
          const bm=p.by_mon&&p.by_mon[m];
          if(!bm||!bm.r)return;
          addP({code,name:p.name,s:bm.s||0,q:bm.q||0,r:bm.r||0,rq:bm.rq||0,item:p.item||'',season:p.season||'',cost:p.cost||0,stock:p.stock||0});
        });
      });
    } else {
      targetMons.forEach(m=>{
        const chMap={};
        s2.selChs.forEach(ch=>{
          const arr=(D.month_ranking&&D.month_ranking[m]&&D.month_ranking[m][ch])||[];
          arr.forEach(p=>{
            if(!p.r)return;
            if(!chMap[p.code])chMap[p.code]={code:p.code,name:p.name,s:0,q:0,r:0,rq:0,item:'',season:'',cost:0,stock:0};
            chMap[p.code].s+=p.s||0;chMap[p.code].q+=p.q||0;chMap[p.code].r+=p.r||0;chMap[p.code].rq+=p.rq||0;
            const _psd=D.ps_data&&D.ps_data[p.code];
            if(_psd){chMap[p.code].item=_psd.item||'';chMap[p.code].season=_psd.season||'';chMap[p.code].cost=_psd.cost||0;chMap[p.code].stock=_psd.stock||0;}
          });
        });
        Object.values(chMap).filter(p=>p.r>0).forEach(addP);
      });
    }
  }
  return Object.values(map)
    .map(p=>({...p,rr:p.s?+(p.r/p.s*100).toFixed(1):0}))
    .filter(p=>(p.r||0)>0)
    .filter(p=>!s2.selSeasons||!s2.selSeasons.length||s2.selSeasons.includes(PRODUCT_SEASON_MAP[p.code]||p.season||''))
    .filter(p=>!s2.selCats||!s2.selCats.length||s2.selCats.includes(p.item||''))
    .sort((a,b)=>b.r-a.r)
    .slice(0,100);
}

function _s2CellMap(p,col){
  const rr=p.s?(p.r/p.s*100).toFixed(1):null;
  const rrColor=rr!==null?(parseFloat(rr)>20?'#c0392b':parseFloat(rr)>10?'#d4830a':'#555'):'#aaa';
  const aov=p.q?Math.round(p.s/p.q):null;
  const stockNum=(STOCK_MAP[p.code]!==undefined?STOCK_MAP[p.code]:(p.stock??null));
  const stockStyle=stockNum!==null&&stockNum<=5?'color:#c0392b;font-weight:700':'color:#1a1a2e';
  const memo=s2Memo[p.code]||'';
  return {
    code:`<td style="text-align:center">${p.code}</td>`,
    season:`<td style="text-align:center">${PRODUCT_SEASON_MAP[p.code]||'-'}</td>`,
    item:(()=>{const _it=p.item||(AU26_ITEM_MAP&&(AU26_ITEM_MAP[p.code]||AU26_ITEM_MAP[p.code&&p.code.slice(0,10)]))||'-';return`<td style="text-align:center">${_it}</td>`;})(),
    name:(()=>{
      const nm=p.name||'';
      let disp=nm;
      if(nm&&!nm.includes('(')){
        const cn=COLOR_MAP[p.code.slice(-2)];
        if(cn)disp=nm+' ('+cn+')';
      }
      return'<td style="text-align:left;padding-left:10px;min-width:140px">'+disp+'</td>';
    })(),
    s:`<td style="text-align:center;${col==='s'?'font-weight:700;color:#111':''}">${won(p.s)}</td>`,
    q:`<td style="text-align:center;${col==='q'?'font-weight:700;color:#111':''}">${Math.max(0,(p.q||0)-(p.rq||0)).toLocaleString('ko-KR')}개</td>`,
    r:`<td style="text-align:center;font-weight:${col==='r'?'700':'400'};color:${(p.r||0)>0?(col==='r'?'#a0260a':'#c0392b'):'#aaa'}">${(p.r||0)>0?won(p.r):'-'}</td>`,
    aov:`<td style="text-align:center;color:#111">${aov?won(aov):'-'}</td>`,
    rq:`<td style="text-align:center;font-weight:600;color:#c0392b;${col==='rq'?'font-weight:700':''}">${(p.rq||0).toLocaleString('ko-KR')}개</td>`,
    rr:`<td style="text-align:center;font-weight:600;color:${rrColor}">${rr!==null?rr+'%':'-'}</td>`,
    cost:`<td style="text-align:center;color:#111">${p.cost?won(p.cost):'-'}</td>`,
    stock:`<td style="text-align:center;${stockStyle}">${stockNum!==null?stockNum.toLocaleString('ko-KR')+'개':'-'}</td>`,
    memo:`<td style="text-align:left;padding:2px 6px;cursor:pointer;min-width:100px;color:${memo?'#333':'#ccc'}" onclick="s2EditMemo('${p.code}',this)">${memo||'메모 입력'}</td>`,
    jin:(()=>{const nq=Math.max(0,(p.q||0)-(p.rq||0));const tot=nq+(stockNum??0);const rate=tot>0?Math.min(100,Math.round(nq/tot*100)):(nq>0?100:0);const color=rate>=80?'#0F6E56':rate>=50?'#BA7517':'#555';return`<td style="text-align:center;font-weight:600;color:${color}">${rate}%</td>`})(),
  };
}

// resultCodes: 현재 보여지는 코드 배열 / _allCodes: 검색된 전체 코드 배열
var ps={query:'',result:null,resultCodes:[],_allCodes:[],_allResult:null,selMons:null,selChs:null,_selectedCode:null,chartCh:'전채널'};

function _psFmt(n){
  if(!n||isNaN(n))return'0';
  if(n<0)return'-'+_psFmt(-n);
  if(n>=100000000){
    const ok=Math.floor(n/100000000);
    const man=Math.round((n%100000000)/10000);
    if(man===0)return ok+'억';
    return ok+'억 '+man+'만';
  }
  if(n>=10000)return Math.round(n/10000)+'만';
  return n.toLocaleString();
}

// 모든 데이터 풀에서 상품 수집 (품번 기준 중복 없이, 연간 합산)
function psAllProducts(){
  const map={};
  // ps_data에서 전체 상품 로드 (TOP_N 제한 없음)
  if(D.ps_data){
    Object.entries(D.ps_data).forEach(([code,v])=>{
      const stk=STOCK_MAP[code]??v.stock??0;
      const cst=COST_MAP[code]??v.cost??0;
      map[code]={code,item:v.item||'',name:v.name||'',season:v.season||'',
                 s:v.s||0,r:v.r||0,q:v.q||0,rq:v.rq||0,cost:cst,stock:stk};
    });
  }
  // 기존 top20/month_ranking도 보완 (ps_data에 없는 경우 대비)
  function add(p){
    const stk=STOCK_MAP[p.code]??p.stock??0;
    const cst=COST_MAP[p.code]??p.cost??0;
    if(!map[p.code])map[p.code]={code:p.code,item:p.item||'',name:p.name||'',season:p.season||'',s:0,r:0,q:0,rq:0,cost:cst,stock:stk};
  }
  if(D.ch_top20)Object.values(D.ch_top20).forEach(arr=>(arr||[]).forEach(add));
  (D.top20_all||[]).forEach(add);
  if(D.month_ranking)Object.values(D.month_ranking).forEach(chMap=>{
    if(chMap)Object.values(chMap).forEach(arr=>(arr||[]).forEach(add));
  });
  return Object.values(map);
}

// 검색 실행 — 품명 검색 시 전 컬러 취합
function psDoSearch(){
  const inp=document.getElementById('ps-input');
  if(!inp)return;
  ps._selectedCode=null; // 새 검색 시 컬러 선택 초기화
  ps.selMons=null;ps.selChs=null; // 전체기간·전채널로 초기화
  const q=(inp.value||'').trim().toLowerCase();
  if(!q){ps.result=null;ps.resultCodes=[];ps.query='';psRenderResult();psRenderFilterBar();return;}
  ps.query=q;
  const all=psAllProducts();

  // 1) 품번 완전일치 → 해당 코드 1개만
  const exactCode=all.find(p=>p.code.toLowerCase()===q);
  if(exactCode){
    ps.resultCodes=[exactCode.code];
    ps._allCodes=[exactCode.code];
    ps._allResult={...exactCode};
    ps.result=exactCode;
    ps.selMons=null;ps.selChs=null;
    psRenderResult();psRenderFilterBar();return;
  }

  // 2) 품명에 검색어 포함 → 모든 컬러 취합
  let matches=all.filter(p=>p.name.toLowerCase().includes(q));

  // 3) 품번 prefix 또는 포함 → 매칭 코드들 취합
  if(!matches.length){
    matches=all.filter(p=>p.code.toLowerCase().startsWith(q)||p.code.toLowerCase().includes(q));
  }

  if(!matches.length){
    ps.result=null;ps.resultCodes=[];
    const el=document.getElementById('ps-result-area');
    if(el)el.innerHTML='<div class="ps-nores">검색 결과가 없습니다. 품번 또는 제품명을 확인해주세요.</div>';
    return;
  }

  // 다중 컬러 취합: 첫 번째 매칭을 base로, 나머지 s/r/q/rq 합산
  ps.resultCodes=matches.map(m=>m.code);
  const base={...matches[0]};
  // 전 컬러 합산
  base.s=matches.reduce((a,p)=>a+(p.s||0),0);
  base.r=matches.reduce((a,p)=>a+(p.r||0),0);
  base.q=matches.reduce((a,p)=>a+(p.q||0),0);
  base.rq=matches.reduce((a,p)=>a+(p.rq||0),0);
  base.stock=matches.reduce((a,p)=>a+(p.stock||0),0);
  base._colorCount=matches.length;
  base._colorNames=matches.map(m=>m.name.match(/\(([^)]+)\)$/)?.[1]||m.code).join(' / ');
  ps.result=base;
  // 전체 코드 저장 (컬러 드릴다운 복귀용)
  ps._allCodes=[...ps.resultCodes];
  ps._allResult={...base};
  ps.selMons=null;ps.selChs=null;
  psRenderResult();psRenderFilterBar();
}

// KPI 계산 — 항상 전 컬러 취합 (_allCodes 우선)
function psCalcKPI(){
  const codes=(ps._allCodes&&ps._allCodes.length)?ps._allCodes:
              (ps.resultCodes.length?ps.resultCodes:(ps.result?[ps.result.code]:[]));
  let s=0,r=0,q=0,rq=0;
  const allMonths=D.months||[];
  const isAllMon=ps.selMons===null;
  const isAllCh=ps.selChs===null;
  const targetMons=isAllMon?allMonths:(ps.selMons||[]);
  const targetChs=isAllCh?VISIBLE_CHS:(ps.selChs||[]);
  if(D.ps_data){
    codes.forEach(code=>{
      const pd=D.ps_data[code]; if(!pd) return;
      if(isAllMon&&isAllCh){
        // 전체기간+전체채널: 직접 합산
        s+=pd.s||0;r+=pd.r||0;q+=pd.q||0;rq+=pd.rq||0;
      } else if(isAllMon&&!isAllCh){
        // 전체기간+특정채널
        targetChs.forEach(ch=>{const bc=pd.by_ch&&pd.by_ch[ch];if(bc){s+=bc.s||0;r+=bc.r||0;q+=bc.q||0;rq+=bc.rq||0;}});
      } else if(!isAllMon&&isAllCh){
        // 특정월+전체채널
        targetMons.forEach(mon=>{const bm=pd.by_mon&&pd.by_mon[mon];if(bm){s+=bm.s||0;r+=bm.r||0;q+=bm.q||0;rq+=bm.rq||0;}});
      } else {
        // 특정월+특정채널: month_ranking 폴백
        function addFrom(arr){const p=(arr||[]).find(x=>x.code===code);if(p){s+=p.s||0;r+=p.r||0;q+=p.q||0;rq+=p.rq||0;}}
        targetMons.forEach(mon=>{
          if(D.month_ranking&&D.month_ranking[mon]){
            if(isAllCh){addFrom(D.month_ranking[mon]['전체']||[]);}
            else{targetChs.forEach(ch=>addFrom(D.month_ranking[mon][ch]||[]));}
          }
        });
      }
    });
  }
  return{s,r,q,rq};
}

// 월별 차트용 데이터 — 다중 코드 지원
function psMonthlyData(ch){
  const codes=(ps._allCodes&&ps._allCodes.length)?ps._allCodes:
              (ps.resultCodes.length?ps.resultCodes:(ps.result?[ps.result.code]:[]));
  const months=D.months||[];
  return months.map(m=>{
    let s=0,r=0;
    if(ch==='전채널'){
      // ps_data.by_mon 사용
      codes.forEach(code=>{
        const bm=D.ps_data&&D.ps_data[code]&&D.ps_data[code].by_mon&&D.ps_data[code].by_mon[m];
        if(bm){s+=bm.s||0;r+=bm.r||0;}
      });
    } else {
      // 특정 채널: month_ranking 사용
      if(D.month_ranking&&D.month_ranking[m]){
        const arr=D.month_ranking[m][ch]||[];
        codes.forEach(code=>{const p=arr.find(x=>x.code===code);if(p){s+=p.s||0;r+=p.r||0;}});
      }
    }
    return{m,s,r};
  });
}

// 기간별 판매추이 차트 HTML 생성
function _psTrendChart(){
  const ch=ps.chartCh||'전채널';

  if(!data||!data.length)return'<div style="padding:12px;text-align:center;color:var(--sub);font-size:11px;">데이터 없음</div>';
  const maxS=Math.max(...data.map(d=>d.s),1);
  const BAR_H=60;
  const bars=data.map(d=>{
    const sh=Math.max(Math.round(d.s/maxS*BAR_H),2);
    const rh=d.r?Math.min(Math.max(Math.round(d.r/maxS*BAR_H),1),sh):0;
    const mon=d.lbl.replace(/^\d{4}-0?/,'')+'월';
    const amt=d.s>=10000?Math.round(d.s/10000)+'만':'';
    return`<div style="flex:1;min-width:18px;display:flex;flex-direction:column;align-items:center;gap:1px;">
      <div style="font-size:8px;color:var(--sub);line-height:1.2;text-align:center;min-height:12px;">${amt}</div>
      <div style="width:100%;height:${BAR_H}px;display:flex;flex-direction:column;justify-content:flex-end;">
        <div style="width:80%;margin:0 auto;height:${sh}px;background:#d4a520;border-radius:2px 2px 0 0;position:relative;overflow:hidden;">

      <div style="font-size:8px;color:var(--sub);line-height:1.2;text-align:center;margin-top:2px;">${mon}</div>

  return`<div style="display:flex;align-items:flex-end;gap:2px;margin-top:2px;">${bars}</div>`;

// 결과 렌더링
function psRenderResult(){
  const el=document.getElementById('ps-result-area');
  if(!el)return;
  if(!ps.result){el.innerHTML='';return;}
  const p=ps.result;
  // 제품 카드: 선택된 단일 컬러가 있으면 해당 컬러 데이터, 없으면 합산 기본
  const selCode=ps._selectedCode||null;
  const allProdsSnap=psAllProducts();
  const cardProd=selCode?(allProdsSnap.find(x=>x.code===selCode)||p):p;
  const imgSrc=IMG_MAP[cardProd.code]||IMG_MAP[p.code]||'';
  const kpi=selCode?_psKPIForCode(selCode):psCalcKPI(); // 컬러 선택 시 해당 컬러 KPI
  const rr=kpi.s>0?((kpi.r/kpi.s)*100).toFixed(1):'0.0';
  // 소진율 (카드에 표시되는 컬러 기준)
  const cardAllKPI=selCode?_psKPIAllForCode(selCode):psCalcKPIAll();
  const cardStk=selCode?(STOCK_MAP[selCode]??cardProd.stock??0)
    :((ps._allCodes&&ps._allCodes.length>1)?ps._allCodes.reduce((a,c)=>{const r=allProdsSnap.find(x=>x.code===c);return a+(r?r.stock||0:0);},0):(p.stock||0));
  const initStk=cardStk+(cardAllKPI.q||0);
  const jinRate=initStk>0?Math.min(100,Math.round((cardAllKPI.q/initStk)*100)):(cardAllKPI.q>0?100:0);
  const colorCount=(ps._allCodes&&ps._allCodes.length)||1;
  // 카드 표시명
  const _cNames=(ps._allCodes||[]).map(code=>{const pr=allProdsSnap.find(x=>x.code===code);if(!pr)return'';const m=pr.name.match(/\(([^)]+)\)/);return m?m[1]:code.slice(-2);}).filter(Boolean).join(' / ');

// 연간 전체 KPI (소진율 계산용) — 다중 코드 지원
function psCalcKPIAll(){
  const codes=(ps._allCodes&&ps._allCodes.length)?ps._allCodes:
              (ps.resultCodes.length?ps.resultCodes:(ps.result?[ps.result.code]:[]));
  let s=0,r=0,q=0,rq=0;
  // ps_data에서 전체 기간 집계 (TOP 제한 없음)
  if(D.ps_data){
    codes.forEach(code=>{
      const pd=D.ps_data[code];
      if(pd){s+=pd.s||0;r+=pd.r||0;q+=pd.q||0;rq+=pd.rq||0;}
    });
  }
  if(!s&&!r){
    // fallback: month_ranking
    function addFrom(arr){codes.forEach(code=>{const p=(arr||[]).find(x=>x.code===code);if(p){s+=p.s||0;r+=p.r||0;q+=p.q||0;rq+=p.rq||0;}});}
    (D.months||[]).forEach(m=>{if(D.month_ranking&&D.month_ranking[m])addFrom(D.month_ranking[m]['전체']||[]);});
    if(!s&&!r){if(D.ch_top20)Object.values(D.ch_top20).forEach(arr=>addFrom(arr));addFrom(D.top20_all||[]);}
  }
  return{s,r,q,rq};
}

// 단일 코드 KPI (컬러별 상세용) — 현재 selMon/selCh 필터 적용
function _psKPIForCode(code){
  const savedCodes=ps.resultCodes;
  const savedAll=ps._allCodes;
  ps.resultCodes=[code];
  ps._allCodes=[code]; // ← _allCodes도 교체해야 psCalcKPI가 단일 코드 기준 계산
  const r=psCalcKPI();
  ps.resultCodes=savedCodes;
  ps._allCodes=savedAll;
  return r;
}

// 컬러별 상세 테이블 HTML 생성 (클릭 드릴다운 지원)
function _psColorBreakdown(){
  const allCodes=ps._allCodes||[];
  if(allCodes.length<2)return'';
  const allProds=psAllProducts();
  const activeSingle=ps._selectedCode||null;

  // ── 정렬 상태 ──
  if(!window._cbSort) window._cbSort={col:null,asc:true};
  const sortCol=window._cbSort.col;
  const sortAsc=window._cbSort.asc;

  let rows=allCodes.map(code=>{
    const prod=allProds.find(x=>x.code===code)||{code,name:'',stock:0};
    const kpi=_psKPIForCode(code);
    const colorMatch=prod.name.match(/\(([^)]+)\)\s*$/);
    const _last2=code.slice(-2);
    const colorName=colorMatch?colorMatch[1]:(/^[A-Z]{2}$/.test(_last2)?(COLOR_MAP[_last2]||_last2):'-');
    const rr=kpi.s>0?((kpi.r/kpi.s)*100).toFixed(1):'0.0';
    const stk=STOCK_MAP[code]??prod.stock??0;
    const allKpi=_psKPIAllForCode(code);
    if(allKpi.q===0&&allKpi.s===0&&allKpi.r===0&&stk===0)return null;
    const initStk=stk+(allKpi.q||0);
    const jinRate=initStk>0?Math.min(100,Math.round((allKpi.q/initStk)*100)):(allKpi.q>0?100:0);
    const netQ=Math.max(0,kpi.q-kpi.rq);
    return{code,colorName,prod,stk,kpi,rr,jinRate,netQ,allKpi};
  }).filter(Boolean);

  // ── 정렬 적용 ──
  if(sortCol){
    rows.sort((a,b)=>{
      let va,vb;
      if(sortCol==='color'){va=a.colorName;vb=b.colorName;}
      else if(sortCol==='q'){va=a.netQ;vb=b.netQ;}
      else if(sortCol==='s'){va=a.kpi.s;vb=b.kpi.s;}
      else if(sortCol==='rr'){va=parseFloat(a.rr);vb=parseFloat(b.rr);}
      else if(sortCol==='stk'){va=a.stk;vb=b.stk;}
      else if(sortCol==='jin'){va=a.jinRate;vb=b.jinRate;}
      else{va=0;vb=0;}
      if(typeof va==='string')return sortAsc?va.localeCompare(vb):vb.localeCompare(va);
      return sortAsc?va-vb:vb-va;
    });
  }

  // ── 정렬 헤더 아이콘 헬퍼 ──
  function sortIcon(col){
    if(sortCol!==col)return'<span style="color:#ccc;margin-left:3px;font-size:9px;">⇅</span>';
    return sortAsc
      ?'<span style="color:var(--accent);margin-left:3px;font-size:9px;">▲</span>'
      :'<span style="color:var(--accent);margin-left:3px;font-size:9px;">▼</span>';
  }
  function thStyle(col,extra){
    return`padding:7px 8px;text-align:center;font-weight:600;font-size:11px;color:var(--sub);background:#f5f4f2;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;${extra||''}`;
  }

  const rowsHtml=rows.map(({code,colorName,prod,stk,kpi,rr,jinRate,netQ,allKpi})=>{
    const imgSrc=(()=>{if(IMG_MAP[code])return IMG_MAP[code];if(code.length>=12)return'';const fb=Object.keys(IMG_MAP).find(k=>k.startsWith(code)&&k!==code);return fb?IMG_MAP[fb]:''})();
    const imgEl=imgSrc
      ?`<img src="${imgSrc}" width="36" height="36" style="object-fit:contain;border-radius:4px;background:#f5f4f2;" onerror="this.style.display='none'">`
      :`<div style="width:36px;height:36px;background:#f0ebe5;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#bbb;">NO</div>`;
    const isActive=activeSingle===code;
    const rowBg=isActive?'background:#f0ebe5;':'';
    const rowBorder=isActive?'border-left:3px solid var(--accent);':'border-left:3px solid transparent;';
    const stkColor=stk<=5&&stk>=0?'color:#e53935;font-weight:700;':'';
    return`<tr onclick="if(!window.getSelection||!window.getSelection().toString())psSelectColor('${code}')" style="cursor:pointer;${rowBg}${rowBorder}transition:background .1s;"
      onmouseover="if('${code}'!=='${activeSingle||''}')this.style.background='#faf9f7'"
      onmouseout="this.style.background='${isActive?'#f0ebe5':''}'">
      <td style="text-align:center;padding:6px 8px;user-select:none;">${imgEl}</td>
      <td style="padding:6px 8px;font-weight:${isActive?'700':'600'};white-space:nowrap;text-align:center;user-select:text;">${colorName}${isActive?'<span style="margin-left:5px;font-size:10px;color:var(--accent);">●</span>':''}</td>
      <td style="padding:6px 8px;font-size:11px;color:#6b4f3a;text-align:center;white-space:nowrap;">${PRODUCT_SEASON_MAP[prod.code]||'-'}</td>
      <td style="padding:6px 8px;font-size:11px;color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;user-select:text;">${prod.name||'-'}</td>
      <td style="padding:6px 8px;font-size:10px;color:var(--sub);white-space:nowrap;text-align:center;user-select:text;cursor:text;">${code}</td>
      <td style="padding:6px 12px;text-align:center;white-space:nowrap;user-select:text;">${netQ.toLocaleString()}개<span style="color:var(--sub);font-size:10px;margin-left:4px;">↩${kpi.rq.toLocaleString()}</span></td>
      <td style="padding:6px 12px;text-align:center;font-weight:600;white-space:nowrap;user-select:text;">${_psFmt(kpi.s)}</td>
      <td style="padding:6px 12px;text-align:center;color:${parseFloat(rr)>20?'var(--neg)':'var(--text)'};white-space:nowrap;">${rr}%</td>
      <td style="padding:6px 12px;text-align:center;white-space:nowrap;${stkColor}">${stk.toLocaleString()}개</td>
      <td style="padding:6px 12px;text-align:center;white-space:nowrap;">${jinRate}%</td>
    </tr>`;
  }).join('');

  const backBtn=activeSingle
    ?`<button onclick="psSelectColor('all')" style="font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-family:inherit;color:var(--text);">← 전체 컬러 보기</button>`
    :'';

  return`<div id="ps-color-breakdown" style="margin-top:12px;">
    <div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      🎨 컬러별 상세
      <span style="font-size:10px;font-weight:400;color:var(--sub);">(${psFilterLabel()})</span>
      ${backBtn}
      ${activeSingle?'':`<span style="font-size:10px;font-weight:400;color:var(--sub);">· 행 클릭 시 해당 컬러 단독 보기</span>`}
    </div>
    <div class="tbl-wrap">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr>
            <th style="padding:7px 8px;background:#f5f4f2;border-bottom:1px solid var(--border);width:44px;text-align:center;"></th>
            <th style="${thStyle('color')}" onclick="_cbSortBy('color')">컬러${sortIcon('color')}</th>
            <th style="${thStyle()}">시즌</th>
            <th style="${thStyle('name')}" onclick="">제품명</th>
            <th style="${thStyle('code')}" onclick="">품번</th>
            <th style="${thStyle('q')}" onclick="_cbSortBy('q')">판매수량(↩반품)${sortIcon('q')}</th>
            <th style="${thStyle('s')}" onclick="_cbSortBy('s')">판매금액${sortIcon('s')}</th>
            <th style="${thStyle('rr')}" onclick="_cbSortBy('rr')">반품률${sortIcon('rr')}</th>
            <th style="${thStyle('stk')}" onclick="_cbSortBy('stk')">재고${sortIcon('stk')}</th>
            <th style="${thStyle('jin')}" onclick="_cbSortBy('jin')">소진율${sortIcon('jin')}</th>
          </tr>
        </thead>
        <tbody style="background:#fff;">${rowsHtml}</tbody>
      </table>
    </div>
  </div>`;
}

  if(!window._cbSort)window._cbSort={col:null,asc:true};
