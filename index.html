// 품번 코드에서 카테고리 추론
function _codeToItem(code){
  if(!code)return '기타';
  var m=code.match(/SN\d[A-Z]\d([A-Z]{2,3})\d/);
  if(!m)return '기타';
  var cat=m[1].toUpperCase();
  if(['TO','TT','TS','TP','TW'].includes(cat))return '티셔츠';          // TW: 스웨트셔츠
  if(['DO','DR','DS','DD','DK','DJ','KD'].includes(cat))return '드레스'; // DD:원피스 DK:니트드레스 DJ:점프수트 KD:니트드레스
  if(['BL','BM','BH','BS','BK','BW','BO','BP','BD','BJ','KS'].includes(cat))return '하의'; // BP:팬츠 BD:데님 BJ:오버롤 KS:니트스커트
  if(['KA','KC','KK','KN','KP','KV'].includes(cat))return '니트웨어';   // KV: 니트탑/베스트
  if(['KJ','JK','OA','OC','OJ','OF','OP','OV','TH'].includes(cat))return '아우터'; // OF:퍼 OP:패딩 OV:베스트 TH:후드집업
  if(['BU','BV','SH','SB','BT','TB'].includes(cat))return '블라우스';   // TB: 블라우스/탑
  if(['AN','SS','AA','AC','AG','AB','AP','AO','AH','AU','AZ','HH','HE','KH','KZ'].includes(cat))return '악세사리'; // 모자/가방/머플러/비니 등
  return '기타';
}
// item 정규화
function _normItem(item,code){
  var NORM={'상의':'티셔츠','하의,바디제품':'하의','악세사리,기타':'악세사리','수영복':'기타','핸드백,가방류':'악세사리','바디':'기타'};
  if(NORM[item])return NORM[item];
  if(!item||item==='기타'||item==='')return _codeToItem(code);
  return item;
}
function s3Cat(){
  var el=document.getElementById('t3c');if(!el)return;
  var MON=MONTHS;
  var curMon=(_catCurMon&&MON.includes(_catCurMon))?_catCurMon:MON[MON.length-1];
  var CAT_COLORS={'니트웨어':'#534AB7','아우터':'#185FA5','드레스':'#D4537E',
    '하의':'#0F6E56','티셔츠':'#BA7517','블라우스':'#639922','악세사리':'#888','기타':'#aaa'};
  var itemTotals={};
  // 모든 채널 합산 (month_ranking에 '전체' 키 없음)
  var _allItems={};
  // D.ps_data.by_mon 기반 동적 계산 (month_ranking 불필요)
  if(D.ps_data){
    for(var _c in D.ps_data){
      var _p=D.ps_data[_c];
      var _md=_p.by_mon&&_p.by_mon[curMon];
      if(!_md)continue;
      var _net=(_md.s||0)-(_md.r||0);if(_net<=0)continue;
      if(!_allItems[_c])_allItems[_c]={name:_p.name||_c,code:_c,s:0,r:0,item:_p.item||''};
      _allItems[_c].s+=(_md.s||0);_allItems[_c].r+=(_md.r||0);
    }
  }
  var top=Object.values(_allItems);
  top.forEach(function(it){
    var net=(it.s||0)-(it.r||0);if(net<=0)return;
    // ITEM_SEASON_MAP에서 카테고리 가져오기
    var smInfo=(typeof ITEM_SEASON_MAP!=='undefined')&&ITEM_SEASON_MAP[it.code];
    var cat=_normItem(smInfo&&smInfo.item||it.item||'',it.code||'');
    if(!itemTotals[cat])itemTotals[cat]=0;
    itemTotals[cat]+=net;
  });
  var sorted=Object.entries(itemTotals).sort(function(a,b){return b[1]-a[1];});
  var total=sorted.reduce(function(a,x){return a+x[1];},0);

  var ddOpts=MON.map(function(m){
    return '<option value="'+m+'"'+(m===curMon?' selected':'')+'>'+parseInt(m)+'월</option>';
  }).join('');

  var barsHtml='';
  if(!total){
    barsHtml='<div style="color:#bbb;font-size:12px;padding:12px 0;text-align:center;">데이터 없음</div>';
  } else {
    sorted.forEach(function(entry){
      var cat=entry[0],val=entry[1];
      var pct=Math.round(val/total*100);
      var col=CAT_COLORS[cat]||'#aaa';
      barsHtml+='<div>'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
          +'<span style="font-size:12px;font-weight:700;color:#111;">'+cat+'</span>'
          +'<span style="font-size:12px;color:#555;">'+val.toLocaleString()+'원&nbsp;&nbsp;<span style="font-weight:700;color:'+col+';">'+pct+'%</span></span>'
        +'</div>'
        +'<div style="height:12px;background:#C8C8C8;border-radius:6px;overflow:hidden;">'
          +'<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:6px;"></div>'
        +'</div>'
      +'</div>';
    });
  }

  // BEST 3 상품 — 비중 상위 2개 카테고리
  var best3Html='';
  var top2Cats=sorted.slice(0,2);
  top2Cats.forEach(function(entry){
    var cat=entry[0];
    var col=CAT_COLORS[cat]||'#aaa';
    var catItems=top.filter(function(it){
      var smInfo=(typeof ITEM_SEASON_MAP!=='undefined')&&ITEM_SEASON_MAP[it.code];
      return _normItem(smInfo&&smInfo.item||it.item||'',it.code||'')===cat;
    });
    catItems.sort(function(a,b){return ((b.s||0)-(b.r||0))-((a.s||0)-(a.r||0));});
    var best3=catItems.slice(0,3);
    best3Html+='<div style="margin-bottom:12px;">'
      +'<div style="font-size:11px;font-weight:700;color:'+col+';border-left:3px solid '+col+';padding-left:6px;margin-bottom:6px;">'+cat+'</div>';
    best3.forEach(function(it,i){
      var net=(it.s||0)-(it.r||0);
      best3Html+='<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #f5f5f5;">'
        +'<span style="font-size:11px;font-weight:800;color:'+col+';min-width:14px;flex-shrink:0;">'+('①②③'[i])+'</span>'
        +'<span style="font-size:11px;font-weight:600;color:#111;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+it.name+'</span>'
        +'<span style="font-size:10px;color:#888;flex-shrink:0;white-space:nowrap;margin-left:4px;">'+(it.season?it.season+' · ':'')+net.toLocaleString()+'원</span>'
      +'</div>';
    });
    best3Html+='</div>';
  });

  el.innerHTML=
    '<div style="display:flex;flex-direction:column;gap:8px;">'
      +barsHtml
    +'</div>'
    +'<div style="border-top:1px solid #f0f0f0;margin:12px 0 8px;"></div>'
    +'<div id="t3cat-best-hdr" onclick="(function(){var d=document.getElementById(\'t3cat-best-body\');var a=document.getElementById(\'t3cat-best-arr\');if(d.style.display===\'none\'){d.style.display=\'block\';a.textContent=\'▲\';}else{d.style.display=\'none\';a.textContent=\'▼\';}})()" style="cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none;margin-bottom:6px;">'
      +'<span style="font-size:11px;font-weight:700;color:#444;">카테고리 BEST 3 상품</span>'
      +'<span id="t3cat-best-arr" style="font-size:11px;color:#aaa;">▼</span>'
    +'</div>'
    +'<div id="t3cat-best-body" style="display:block;">'
      +(best3Html||'<div style="color:#bbb;font-size:11px;">데이터 없음</div>')
    +'</div>';

  var dd=document.getElementById('t3cat-dd');
  if(dd) dd.addEventListener('change',function(){setCatMon(this.value);});
}

  var el=document.getElementById('t3aov-table');if(!el)return;
  var MAIN_CHS=['자사몰','29CM','무신사'];
  var SUB_CHS=['무신사글로벌','자사몰_해외','카카오톡'];
  var CH_META={
    '자사몰':      {c:'#534AB7',bg:'#fff',tc:'#3C3489',light:'#B0A8F0'},
    '29CM':        {c:'#185FA5',bg:'#fff',tc:'#0C447C',light:'#7FB2DC'},
    '무신사':      {c:'#0F6E56',bg:'#fff',tc:'#085041',light:'#5BB99F'},
    '무신사글로벌':{c:'#BA7517',bg:'#fff',tc:'#854F0B',light:'#D9A24A'},
    '자사몰_해외': {c:'#D4537E',bg:'#fff',tc:'#993556',light:'#E88AAE'},
    '카카오톡':    {c:'#639922',bg:'#fff',tc:'#3B6D11',light:'#8FBF3A'}
  };
  var MON=MONTHS;

  var curMon;
  curMon=(_aovCurMon&&MON.includes(_aovCurMon))?_aovCurMon:MON[MON.length-1];
  var curIdx=MON.indexOf(curMon);
  var prevMon=curIdx>0?MON[curIdx-1]:null;

  var allChs=MAIN_CHS.concat(SUB_CHS);
  var vals=allChs.map(function(ch){
    var a=MONTHLY_AOV[ch]||{};
    return{ch:ch,val:a[curMon]||null,prev:prevMon?a[prevMon]||null:null};
  });

  var ddOpts=MON.map(function(m){
    return '<option value="'+m+'"'+(m===curMon?' selected':'')+'>'+parseInt(m)+'월</option>';
  }).join('');

  function mkCard(item){
    var ch=item.ch,val=item.val,prev=item.prev;
    if(!val)return '';
    var m=CH_META[ch]||{c:'#888',bg:'#f8f8f8',tc:'#444',light:'#eee'};
    var momDiff=prev?Math.round((val-prev)/prev*100):null;
    var momColor=momDiff===null?'#aaa':momDiff>=0?'#0F6E56':'#E24B4A';
    var momArr=momDiff===null?'':momDiff>=0?'▲':'▼';
    var momTxt=momDiff===null?'—':momArr+Math.abs(momDiff)+'%';
    return '<div style="background:'+m.bg+';border-radius:14px;border:1px solid '+m.light+';border-top:5px solid '+m.c+';padding:18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 3px 14px rgba(0,0,0,.09);">'
      // 채널명
      +'<div style="display:flex;align-items:center;gap:7px;">'
        +'<span style="width:9px;height:9px;border-radius:50%;background:'+m.c+';flex-shrink:0;"></span>'
        +'<span style="font-size:13px;font-weight:700;color:#111;">'+ch+'</span>'
      +'</div>'
      // 메인 금액
      +'<div style="font-size:26px;font-weight:700;color:'+m.tc+';letter-spacing:-0.5px;line-height:1;">'
        +val.toLocaleString()
        +'<span style="font-size:13px;font-weight:500;color:'+m.c+';margin-left:3px;">원</span>'
      +'</div>'
      // 전월비 + 전월값
      +'<div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid '+m.light+';padding-top:8px;">'
        +'<span style="font-size:12px;font-weight:700;color:'+momColor+';">'+momTxt+' 전월비</span>'
        +(prev?'<span style="font-size:11px;color:#aaa;">전월 '+prev.toLocaleString()+'원</span>':'')
      +'</div>'
    +'</div>';
  }

  var mainCards='';
  MAIN_CHS.forEach(function(ch){
    var item=vals.find(function(v){return v.ch===ch;});
    if(item) mainCards+=mkCard(item);
  });

  var subCards='';
  SUB_CHS.forEach(function(ch){
    var item=vals.find(function(v){return v.ch===ch;});
    if(item) subCards+=mkCard(item);
  });

  el.innerHTML=
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">'
      +mainCards
    +'</div>'
    +(subCards?
      '<div onclick="(function(){var w=document.getElementById(\'aov-sub-wrap\');var a=document.getElementById(\'aov-sub-arrow\');if(w.style.display===\'none\'){w.style.display=\'grid\';a.textContent=\'▲\';}else{w.style.display=\'none\';a.textContent=\'▼\';}})()" style="cursor:pointer;display:flex;align-items:center;gap:5px;padding:10px 2px 4px;user-select:none;margin-top:4px;">'
        +'<span style="font-size:11px;color:#555;font-weight:600;">다른 채널 더보기</span>'
        +'<span id="aov-sub-arrow" style="font-size:10px;color:#888;">▼</span>'
      +'</div>'
      +'<div id="aov-sub-wrap" style="display:none;grid-template-columns:repeat(3,1fr);gap:10px;">'
        +subCards
      +'</div>'
    :'')
    +'<div style="margin-top:10px;font-size:11px;color:#666;">* 객단가 = 판매금액(반품 미차감) ÷ 판매수량</div>';

  var dd=document.getElementById('t3aov-dd');
  if(dd) dd.addEventListener('change',function(){setAOVMon(this.value);});

let s3CustSeasonMon=null;
// 주차 키에서 시작 월 추출 — "07/27~08/02"→"07", "7월1주"→"07"
function _wkStartMon(w){
  if(!w)return null;
  if(/^\d{2}\//.test(w))return w.substring(0,2);
  var m=w.match(/^(\d+)월/);
  return m?String(parseInt(m[1])).padStart(2,'0'):null;
}
// 주차 키에서 종료 월 추출 — "07/27~08/02"→"08", 월주 형식→시작 월과 동일
function _wkEndMon(w){
  if(!w)return null;
  if(/^\d{2}\//.test(w)&&w.length>=9)return w.substring(6,8);
  return _wkStartMon(w);
}
function _getCSMon(){
  if(!s3CustSeasonMon){
    const all=loadCustData();
    if(all.length){
      const months=[...new Set(all.map(d=>_wkStartMon(d.w)).filter(Boolean))].sort();
      s3CustSeasonMon=months[months.length-1];
    } else {
      s3CustSeasonMon=MONTHS[MONTHS.length-1].replace('월','').padStart(2,'0');
    }
  }
  return s3CustSeasonMon;
}

  var chs=(typeof VISIBLE_CHS!=='undefined')?VISIBLE_CHS:['자사몰','29CM','무신사','무신사글로벌','카카오톡'];
  chs.forEach(function(ch){
    var arr=(D.month_ranking&&D.month_ranking[mLabel]&&D.month_ranking[mLabel][ch])||[];
    arr.forEach(function(it){
      var net=(it.s||0)-(it.r||0);if(net<=0)return;
      var div=getProductDiv(it.code,it.season);
      if(!cats[div])return;
      if(!cats[div][it.code])cats[div][it.code]={name:it.name,amt:0};
      cats[div][it.code].amt+=net;
    });
  });
  var result={};
  ['신상','캐리오버','익클','이월'].forEach(function(div){
    result[div]=Object.values(cats[div]).sort(function(a,b){return b.amt-a.amt;}).slice(0,3);
  });
  return result;
}

function mkSeasonDivCard(mLabel){
  var cats=[
    {k:'신상',  c:'#F7875B',bg:'#FFF0EB'},
    {k:'캐리오버',c:'#5B8CF7',bg:'#EEF2FF'},
    {k:'익클',  c:'#A855F7',bg:'#F5F3FF'},
    {k:'이월',  c:'#9CA3AF',bg:'#F3F4F6'}
  ];
  // MONTHLY_DIVISION → 동적 계산 우선, 없으면 하드코딩 폴백
  var _dynDiv=_calcMonthSeasonDynamic(mLabel).division;
  var _hasDiv=Object.values(_dynDiv).some(function(v){return v>0;});
  var div=_hasDiv?{'신상':_dynDiv['신상']||0,'캐리오버':_dynDiv['캐리오버']||0,'익클':_dynDiv['익스클루시브']||0,'이월':_dynDiv['이월']||0}:((typeof MONTHLY_DIVISION!=='undefined'&&MONTHLY_DIVISION[mLabel])||{});
  var tot=cats.reduce(function(a,x){return a+(div[x.k]||0);},0);
  if(!tot) return '<div style="color:#ccc;font-size:12px;text-align:center;padding:10px 0;">데이터 없음</div>';
  // 두꺼운 바 (텍스트 포함)
  var bar='';
  cats.forEach(function(x){
    var pct=div[x.k]?Math.round(div[x.k]/tot*100):0;
    if(pct<=0)return;
    var txt=pct>=10?('<span style="font-size:13px;font-weight:800;color:#fff;white-space:nowrap;">'+x.k+' '+pct+'%</span>'):'';
    bar+='<div style="width:'+pct+'%;background:'+x.c+';display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:0 2px;box-sizing:border-box;">'+txt+'</div>';
  });
  // 범례
  var leg='';
  cats.forEach(function(x){
    var pct=div[x.k]?Math.round(div[x.k]/tot*100):0;
    leg+='<div style="display:flex;align-items:center;gap:5px;padding:4px 8px;background:'+x.bg+';border-radius:6px;">'
      +'<span style="width:8px;height:8px;border-radius:50%;background:'+x.c+';flex-shrink:0;"></span>'
      +'<span style="font-size:11px;color:#555;">'+x.k+'</span>'
      +'<span style="font-size:13px;font-weight:700;color:'+x.c+';">'+pct+'%</span>'
      +'</div>';
  });
  // TOP3 섹션
  var top3=getSeasonTop3(mLabel);
  var top3Html='';
  cats.forEach(function(x){
    var items=top3[x.k]||[];
    if(!items.length)return;
    top3Html+='<div style="flex:1;min-width:140px;">'
      +'<div style="font-size:11px;font-weight:700;color:'+x.c+';margin-bottom:6px;padding:3px 8px;background:'+x.bg+';border-radius:5px;display:inline-block;">'+x.k+' TOP3</div>';
    items.forEach(function(p,i){
      top3Html+='<div style="display:flex;align-items:flex-start;gap:5px;padding:4px 0;border-bottom:1px solid #f5f5f5;">'
        +'<span style="font-size:11px;font-weight:700;color:#bbb;min-width:13px;flex-shrink:0;">'+(i+1)+'</span>'
        +'<span style="font-size:11px;color:#222;flex:1;line-height:1.4;">'+p.name+'</span>'
        +'<span style="font-size:11px;color:#777;flex-shrink:0;font-weight:600;">'+wonShort(p.amt)+'</span>'
        +'</div>';
    });

  var toggleId='season-top3-'+mLabel.replace('월','');

       +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">'+leg+'</div>'

       +'<div id="'+toggleId+'" style="display:none;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid #f5f5f5;">'+top3Html+'</div>':'');

    const endMon=_wkEndMon(d.w);
    if(endMon&&endMon!==_wkStartMon(d.w))monthSet.add(endMon);

  const monthKeys=[...monthSet].sort();
  if(!monthKeys.length){el.innerHTML='<div style="color:#111;padding:20px;text-align:center;">데이터 없음</div>';return;}

  const monRows=all.filter(d=>_wkStartMon(d.w)===mon||(_wkEndMon(d.w)===mon&&_wkStartMon(d.w)!==mon));

  function calcAvg(rows){
    if(!rows.length)return null;

    const tot=sN+sR;
    return{n:sN,r:sR,nPct:tot>0?Math.round(sN/tot*100):0};

// 구매전환율/신규기존 주차 레이블 → "M/D - M/D" 형식 변환
function _convWkLabel(w){
  // "MM/DD~MM/DD" 형태 파싱
  var m=w.match(/^(\d{2})\/(\d{2})~(\d{2})\/(\d{2})$/);
  if(m){
    var sM=parseInt(m[1]),sD=parseInt(m[2]);
    var eM=parseInt(m[3]),eD=parseInt(m[4]);
    var startStr=sM+'/'+sD;
    // 종료일이 오늘 이후면 오늘 날짜로 제한
    var today=new Date(); today.setHours(0,0,0,0);
    var endDate=new Date('2026-'+m[3]+'-'+m[4]);
    if(endDate>today){eM=today.getMonth()+1;eD=today.getDate();}
    return startStr+' - '+eM+'/'+eD;
  }
  // week_to_dates 키 형태(예:"7월1주")이면 날짜 배열 범위 계산
  if(D.week_to_dates&&D.week_to_dates[w]){
    var dates=[...D.week_to_dates[w]].sort();
    var df=new Date(dates[0]),dl=new Date(dates[dates.length-1]);
    return (df.getMonth()+1)+'/'+df.getDate()+' - '+(dl.getMonth()+1)+'/'+dl.getDate();
  }
  return w;
}
function renderConvTable(){
  const el=document.getElementById('t3conv-table');if(!el)return;
  const all=loadConvData();

  // 월별 그룹핑 (월 경계 주차는 양쪽 월에 모두 포함)
  const monthGroups={};
  const _addToMGrp=(mon,d,i)=>{if(!monthGroups[mon])monthGroups[mon]=[];if(!monthGroups[mon].find(x=>x.d.w===d.w))monthGroups[mon].push({d,i});};
  all.forEach((d,i)=>{
    const startMon=(_wkStartMon(d.w)||'00')+'월';
    _addToMGrp(startMon,d,i);
    // 주차는 시작 월 기준으로만 분류
  });
  const monthKeys=Object.keys(monthGroups);
  if(!monthKeys.length){el.innerHTML='<div style="color:#aaa;padding:20px;text-align:center;">데이터 없음</div>';return;}

  // 월별 합계/평균
  const monthAvgs={};
  monthKeys.forEach(mon=>{
    const rows=monthGroups[mon];
    const sumV=rows.reduce((a,{d})=>a+d.v,0);
    const sumB=rows.reduce((a,{d})=>a+d.b,0);
    const sumO=rows.reduce((a,{d})=>a+d.o,0);
    const avgR=sumV>0?parseFloat((sumB/sumV*100).toFixed(2)):parseFloat((rows.reduce((a,{d})=>a+d.r,0)/rows.length).toFixed(2));
    monthAvgs[mon]={v:sumV,b:sumB,o:sumO,r:avgR};
  });

  // 선택 월 — 구매자 데이터(b>0)가 있는 가장 최신 월 기본 선택
  let curMon;
  if(_convCurMon&&monthKeys.includes(_convCurMon)){
    curMon=_convCurMon;
  } else {
    const validMons=monthKeys.filter(m=>monthAvgs[m].b>0);
    curMon=validMons.length?validMons[validMons.length-1]:monthKeys[monthKeys.length-1];
  }
  const curIdx=monthKeys.indexOf(curMon);
  const prevMon=curIdx>0?monthKeys[curIdx-1]:null;
  const cur=monthAvgs[curMon];
  const prev=prevMon?monthAvgs[prevMon]:null;
  const momDiff=prev?parseFloat((cur.r-prev.r).toFixed(2)):null;

  // 전환율 스케일 (0~최대치 기준 바 높이)
  const maxR=Math.max(...Object.values(monthAvgs).map(a=>a.r),0.01);
  const barScaleMax=3.0; // progress bar 기준 (0~3%)

  // 드롭다운
  const ddOpts=monthKeys.map(m=>'<option value="'+m+'" '+(m===curMon?'selected':'')+'>'+parseInt(m)+'월</option>').join('');


  // 월별 트렌드 바
  let trendBars='';
  monthKeys.forEach(m=>{
    const a=monthAvgs[m];
    const hPct=maxR>0?Math.max(10,Math.round(a.r/maxR*100)):10;
    const isCur=m===curMon;
    trendBars+='<div onclick="setConvMon(\''+m+'\')" style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;cursor:pointer;gap:2px;">'
      +'<div style="width:80%;background:'+(isCur?'#534AB7':'#CECBF6')+';border-radius:3px 3px 0 0;height:'+hPct+'px;'+(isCur?'outline:1.5px solid #534AB7;outline-offset:1px;':'')+'"></div>'
      +'<span style="font-size:9px;color:'+(isCur?'#534AB7':'#aaa')+';font-weight:'+(isCur?'700':'400')+';">'+parseInt(m)+'</span>'
    +'</div>';
  });

  // progress bar width (0~3% 기준)
  const barW=Math.min(100,Math.max(1,Math.round(cur.r/barScaleMax*100)));
  const momColor=momDiff===null?'#aaa':momDiff>=0?'#0F6E56':'#E24B4A';
  const momText=momDiff===null?'—':(momDiff>=0?'▲ +':'▼ ')+Math.abs(momDiff)+'%p 전월비';

  el.innerHTML=
  // KPI 3개 가로 배치
  '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;">'

      +'<span style="font-size:26px;font-weight:800;color:#111;line-height:1;">'+cur.v.toLocaleString()+'</span>'
    +'</div>'

function s4ShowLayoutMsg(msg, color){
  var el=document.getElementById('s4-layout-msg');
  if(!el)return;
  el.textContent=msg;
  el.style.color=color||'#27ae60';
  el.style.display='inline';

function s4ExportLayout(){
  var layout={
    col_w: s4ColWidths,
    row_h: s4RowHeights,
    exported: new Date().toISOString(),
    ver: '1.0'
  };
  var json=JSON.stringify(layout,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var d=new Date();
  var dateStr=d.getFullYear()+''+(d.getMonth()+1+'').padStart(2,'0')+''+(d.getDate()+'').padStart(2,'0');
  a.href=url;
  a.download='sinoon_promo_layout_'+dateStr+'.json';
  a.click();
  URL.revokeObjectURL(url);
  s4ShowLayoutMsg('✓ 내보내기 완료 — 팀원과 파일을 공유하세요','#27ae60');
}

function s4ImportLayout(e){
  var file=e.target.files&&e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var layout=JSON.parse(ev.target.result);
      if(layout.col_w){
        s4ColWidths=layout.col_w;
        localStorage.setItem('sinoon_s4_col_w',JSON.stringify(s4ColWidths));
      }
      if(layout.row_h){
        s4RowHeights=layout.row_h;
        localStorage.setItem('sinoon_s4_row_h',JSON.stringify(s4RowHeights));
      }
      s4ApplyResizeSizes();
      s4ShowLayoutMsg('✓ 가져오기 완료 — 레이아웃이 적용됐습니다','#27ae60');
    }catch(err){
      s4ShowLayoutMsg('✗ 파일 오류: 올바른 레이아웃 파일인지 확인하세요','#e74c3c');
    }
    e.target.value='';
  };
  reader.readAsText(file);
}

function s4ResetLayout(){
  if(!confirm('열 너비·행 높이를 기본값으로 초기화할까요?'))return;
  s4ColWidths={};s4RowHeights={};
  try{
    localStorage.removeItem('sinoon_s4_col_w');
    localStorage.removeItem('sinoon_s4_row_h');
  }catch(e){}
  // 모든 s4-resizable 테이블 셀 인라인 스타일 제거
  document.querySelectorAll('.s4-resizable th,.s4-resizable td').forEach(function(cell){
    cell.style.width='';cell.style.minWidth='';
    cell.style.height='';cell.style.maxHeight='';cell.style.overflow='';cell.style.verticalAlign='';
    Array.from(cell.children).forEach(function(ch){ch.style.maxHeight='';ch.style.overflow='';});
  });
  document.querySelectorAll('.s4-resizable tr').forEach(function(tr){
    tr.style.height='';
  });

}

const S4_EDIT_PW = '1111';
let s4Unlocked = false;

function s4ToggleLock(){
  if(s4Unlocked){
    s4Unlocked = false;
    s4ApplyLockState();
  } else {
    const pw = prompt('편집 비밀번호를 입력하세요:');
    if(pw === null) return;
    if(pw === S4_EDIT_PW){
      s4Unlocked = true;
      s4ApplyLockState();
    } else {
      alert('비밀번호가 올바르지 않습니다.');
    }
  }
}

function s4ApplyLockState(){
  const bl = document.getElementById('s4-lock-badge');
  const be = document.getElementById('s4-edit-badge');
  const ht = document.getElementById('s4-mode-hint');
  const lb = document.getElementById('s4-lock-btn');
  const sb = document.getElementById('s4-save-btn');
  var tb=document.getElementById('s4-format-toolbar');
  if(s4Unlocked){
    if(bl) bl.style.display='none';
    if(be) be.style.display='';
    if(tb) tb.style.display='flex';
    if(ht) ht.textContent='셀을 클릭해서 수정 후 💾 저장 버튼을 눌러주세요.';
    if(lb){lb.textContent='🔒 편집 잠금';lb.style.background='#c0392b';lb.style.borderColor='#c0392b';}
    if(sb) sb.style.display='';
  } else {
    if(bl) bl.style.display='';
    if(be) be.style.display='none';
    if(tb) tb.style.display='none';
    if(ht) ht.textContent='편집하려면 잠금을 해제하세요.';
    if(lb){lb.textContent='🔓 편집 잠금 해제';lb.style.background='#8b6f5e';lb.style.borderColor='#8b6f5e';}
    if(sb) sb.style.display='none';
  }
  document.querySelectorAll('.s4-editable, #s4-table [contenteditable], #s4-table [data-idx]').forEach(function(el){
    el.contentEditable = s4Unlocked ? 'true' : 'false';
    el.style.cursor = s4Unlocked ? 'text' : 'default';
  });
  // 리사이즈 핸들 활성화/비활성화
  document.querySelectorAll('table.s4-resizable').forEach(function(tbl){
    if(s4Unlocked) tbl.classList.add('unlocked');
    else tbl.classList.remove('unlocked');
  });
}

function s4Focus(el){
  if(!s4Unlocked){el.blur();return;}
  el.dataset.prevColor=el.style.color||'';
  el.dataset.prevWeight=el.style.fontWeight||'';
  el.dataset.prevBg=el.style.background||'';
  el.style.outline='2px solid #d4a520';
  el.style.background='#fffef7';
}
function s4NumFocus(el){
  // 포커스 시 쉼표 제거해서 순수 숫자만 편집 가능하게
  const raw=el.textContent.replace(/[^0-9]/g,'');
  el.textContent=raw||'';
  // 커서를 텍스트 끝으로 이동
  const range=document.createRange();
  const sel=window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}
function s4SaveCell(el){
  el.style.outline='';
  const idx=parseInt(el.dataset.idx);
  const key=el.dataset.key;
  if(isNaN(idx)||!key)return;
  // 서식 복원
  if(key==='qty_raw'||key==='sales_raw'){
    el.style.color='#c0392b';el.style.fontWeight='700';
    el.style.background='';
  } else {
    el.style.color=el.dataset.prevColor||'';
    el.style.fontWeight=el.dataset.prevWeight||'';
    el.style.background=el.dataset.prevBg||'';
  }
  const val=el.innerHTML.replace(/<div[^>]*>/gi,'').replace(/<\/div>/gi,'\n').replace(/<br\s*\/?>/gi,'\n').trim();
  const clean=el.innerText.trim();
  if(key==='qty_raw'){
    const num=parseInt(clean.replace(/[^0-9]/g,''));
    PROMO_DATA[idx].qty=isNaN(num)?null:num;
    el.textContent=(!isNaN(num)&&num!==null)?num.toLocaleString():'—';
  } else if(key==='tgt_raw'){
    const num=parseInt(clean.replace(/[^0-9]/g,''));
    PROMO_DATA[idx].tgt=isNaN(num)?null:num;
    el.textContent=(!isNaN(num)&&num!==null)?num.toLocaleString():'—';
    // ── 목표 변경 시에도 달성률 자동 재계산 ──
    if(!isNaN(num)&&num>0&&PROMO_DATA[idx].sales!=null){
      const autoAch=Math.round((PROMO_DATA[idx].sales/num)*1000)/10;
      PROMO_DATA[idx].ach=autoAch;
      s4TrackEdit(idx,'ach',autoAch);
      const achCell=document.querySelector('[data-idx="'+idx+'"][data-key="ach"]');
      if(achCell){
        achCell.textContent=autoAch+'%';
        const ac=autoAch>=100?'#1e7a4a':autoAch>=70?'#d4830a':'#c0392b';
        achCell.style.color=ac;achCell.style.fontWeight='700';
      }
    }
  } else if(key==='sales_raw'){
    const num=parseInt(clean.replace(/[^0-9]/g,''));
    PROMO_DATA[idx].sales=isNaN(num)?null:num;
    el.textContent=(!isNaN(num)&&num!==null)?num.toLocaleString():'—';
    // ── 판매금액 입력 시 달성률 자동 계산 ──
    if(!isNaN(num)&&PROMO_DATA[idx].tgt&&PROMO_DATA[idx].tgt>0){
      const autoAch=Math.round((num/PROMO_DATA[idx].tgt)*1000)/10;
      PROMO_DATA[idx].ach=autoAch;
      s4TrackEdit(idx,'ach',autoAch);
      const achCell=document.querySelector('[data-idx="'+idx+'"][data-key="ach"]');
      if(achCell){
        achCell.textContent=autoAch+'%';
        const ac=autoAch>=100?'#1e7a4a':autoAch>=70?'#d4830a':'#c0392b';
        achCell.style.color=ac;achCell.style.fontWeight='700';
      }
    } else if(!isNaN(num)&&num===0){
      PROMO_DATA[idx].ach=0;
      s4TrackEdit(idx,'ach',0);
      const achCell=document.querySelector('[data-idx="'+idx+'"][data-key="ach"]');
      if(achCell){achCell.textContent='—';achCell.style.color='#999';achCell.style.fontWeight='700';}
    }
  } else {
    PROMO_DATA[idx][key]=el.innerHTML;
  }
  s4TrackEditFromCell(idx,key,el);
}

// ── 열/행 리사이즈 ──
var s4ColWidths={},s4RowHeights={};

function s4ApplyResizeSizes(){
  document.querySelectorAll('table.s4-resizable').forEach(function(tbl){
    var id=tbl.id;
    // 열 너비 적용
    if(s4ColWidths[id]&&s4ColWidths[id].length){
      tbl.style.tableLayout='fixed';
      var cg=tbl.querySelector('colgroup');
      if(!cg){cg=document.createElement('colgroup');tbl.insertBefore(cg,tbl.firstChild);}
      cg.innerHTML='';
      s4ColWidths[id].forEach(function(w){
        var col=document.createElement('col');
        if(w)col.style.width=w+'px';
        cg.appendChild(col);
      });
    }
    // 행 높이 적용
    if(s4RowHeights[id]){
      var rows=tbl.querySelectorAll('tbody tr:not(.s4-row-resize-tr)');
      rows.forEach(function(tr,i){
        var h=s4RowHeights[id][i];
        if(h!=null){
          tr.style.height=h+'px';
          tr.querySelectorAll('td').forEach(function(td){
            td.style.height=h+'px';
            var wrap=td.querySelector('.s4-cell-wrap');
            if(wrap){wrap.style.height=h+'px';wrap.style.overflow='hidden';}
          });
        }
      });
    }
  });
}

function s4ColResizeStart(e,handle){
  if(!s4Unlocked)return;
  e.preventDefault();e.stopPropagation();
  var th=handle.parentElement;
  var table=th.closest('table');
  var headRow=th.closest('tr');
  var allThs=Array.from(headRow.querySelectorAll('th'));
  var idx=allThs.indexOf(th);
  // 첫 리사이즈: 현재 모든 열 너비 캡처 후 fixed로 전환
  if(table.style.tableLayout!=='fixed'){
    var ws=allThs.map(function(t){return t.getBoundingClientRect().width;});
    table.style.tableLayout='fixed';
    var cg=table.querySelector('colgroup');
    if(!cg){cg=document.createElement('colgroup');table.insertBefore(cg,table.firstChild);}
    cg.innerHTML='';
    ws.forEach(function(w){var col=document.createElement('col');col.style.width=w+'px';cg.appendChild(col);});
    s4ColWidths[table.id]=ws.slice();
  }
  var startX=e.clientX;
  var cols=table.querySelectorAll('col');
  var startW=cols[idx]?parseFloat(cols[idx].style.width)||allThs[idx].getBoundingClientRect().width:100;
  function onMove(ev){
    var diff=ev.clientX-startX;
    var newW=Math.max(40,startW+diff);
    if(cols[idx])cols[idx].style.width=newW+'px';
    if(s4ColWidths[table.id])s4ColWidths[table.id][idx]=newW;
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    // 드래그 종료 후 localStorage 자동 저장 + Firebase 동기화
    try{localStorage.setItem('sinoon_s4_col_w',JSON.stringify(s4ColWidths));jsonbinSave();}catch(ex){}
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function s4RowResizeStart(e,cell){
  if(!s4Unlocked)return;
  e.preventDefault();e.stopPropagation();
  var resizeTr=cell.parentElement;
  var dataTr=resizeTr.previousElementSibling;
  if(!dataTr)return;
  var table=dataTr.closest('table');
  var rows=Array.from(table.querySelectorAll('tbody tr:not(.s4-row-resize-tr)'));
  var rowIdx=rows.indexOf(dataTr);
  var startY=e.clientY;
  var startH=dataTr.getBoundingClientRect().height;
  function _applyRowH(tr,h){
    tr.style.height=h+'px';
    tr.querySelectorAll('td').forEach(function(td){
      td.style.height=h+'px';
      var wrap=td.querySelector('.s4-cell-wrap');
      if(wrap){wrap.style.height=h+'px';wrap.style.overflow='hidden';}
    });
  }
  function onMove(ev){
    var diff=ev.clientY-startY;
    var newH=Math.max(24,startH+diff);
    _applyRowH(dataTr,newH);
    if(!s4RowHeights[table.id])s4RowHeights[table.id]={};
    s4RowHeights[table.id][rowIdx]=newH;
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    // 드래그 종료 후 localStorage 자동 저장 + Firebase 동기화
    try{localStorage.setItem('sinoon_s4_row_h',JSON.stringify(s4RowHeights));jsonbinSave();}catch(ex){}
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function s4FmtFontSize(delta){
  s4RestoreSel();
  var sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  var node=sel.getRangeAt(0).startContainer;
  if(node.nodeType===3)node=node.parentElement;
  var curSize=parseFloat(window.getComputedStyle(node).fontSize)||12;
  var newSize=Math.max(8,Math.min(40,Math.round(curSize+delta)));
  document.execCommand('styleWithCSS',false,false);
  document.execCommand('fontSize',false,'7');
  var area=document.getElementById('s4-table')||document.body;
  area.querySelectorAll('font[size="7"]').forEach(function(el){
    var sp=document.createElement('span');
    sp.style.fontSize=newSize+'px';
    while(el.firstChild)sp.appendChild(el.firstChild);
    el.parentNode.replaceChild(sp,el);
  });
  if(s4ActiveCell)s4AutoSaveCell(s4ActiveCell);
}

function s4LoadFullPromo(){
  try{
    var saved=localStorage.getItem('sinoon_promo_data');
    if(saved){
      var arr=JSON.parse(saved);
      if(arr&&arr.length>0){
        var MON_ORD=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
        var savedMax=Math.max.apply(null,arr.map(function(d){return MON_ORD.indexOf(d.mon);}));
        var defMax=Math.max.apply(null,PROMO_DATA.map(function(d){return MON_ORD.indexOf(d.mon);}));
        if(defMax>savedMax){
          // 기본 PROMO_DATA에 새 월 추가됨 → 병합: Firebase 편집본 유지 + 새 월만 추가
          var savedMons=new Set(arr.map(function(d){return d.mon;}));
          var newItems=PROMO_DATA.filter(function(d){return !savedMons.has(d.mon);});
          PROMO_DATA.length=0;
          arr.forEach(function(r){PROMO_DATA.push(r);});
          newItems.forEach(function(r){PROMO_DATA.push(r);});
        } else {
          // 저장본이 최신이거나 같음 → 저장본 전체 사용 (편집 반영)
          PROMO_DATA.length=0;
          arr.forEach(function(r){PROMO_DATA.push(r);});
        }
        return true;
      }
    }
  }catch(e){}
  return false;
}

function mktApplyLockState(){
  var bl=document.getElementById('mkt-lock-badge');

  var ht=document.getElementById('mkt-mode-hint');

  var sb=document.getElementById('mkt-save-btn');

    if(tb)tb.style.display='flex';
    var drTb=document.getElementById('mkt-dr-toolbar'),rvTb=document.getElementById('mkt-rv-toolbar');
    if(drTb)drTb.style.display='flex';if(rvTb)rvTb.style.display='flex';

    if(lb){lb.textContent='🔒 편집 잠금';lb.style.background='#c0392b';lb.style.borderColor='#c0392b';}
    if(sb)sb.style.display='';

    var dr=document.getElementById('mkt-daily-report-area');
    if(dr){dr.contentEditable='true';dr.style.background='#fff';}
  }else{
    if(bl)bl.style.display='';
    if(be)be.style.display='none';
    if(tb)tb.style.display='none';
    var drTb=document.getElementById('mkt-dr-toolbar'),rvTb=document.getElementById('mkt-rv-toolbar');
    if(drTb)drTb.style.display='none';if(rvTb)rvTb.style.display='none';
    if(ht)ht.textContent='편집하려면 잠금을 해제하세요.';
    if(lb){lb.textContent='🔓 편집 잠금 해제';lb.style.background='#8b6f5e';lb.style.borderColor='#8b6f5e';}
    if(sb)sb.style.display='none';

function mktFmtFontSize(px){
  mktRestoreSel();
  document.execCommand('styleWithCSS',false,true);
  document.execCommand('fontSize',false,'7');
  var sel=window.getSelection();
  if(sel&&sel.rangeCount>0){
    var range=sel.getRangeAt(0);
    var spans=range.commonAncestorContainer.parentNode?range.commonAncestorContainer.parentNode.querySelectorAll('font[size="7"]'):[];
    spans.forEach(function(s){s.removeAttribute('size');s.style.fontSize=px+'px';});
  }
  mktFmtAfterSave();
}
function mktFmtFontSizeDelta(delta){
  mktRestoreSel();
  var sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  var node=sel.getRangeAt(0).startContainer;
  if(node.nodeType===3)node=node.parentElement;
  var curSize=parseFloat(window.getComputedStyle(node).fontSize)||12;
  var newSize=Math.max(8,Math.min(40,Math.round(curSize+delta)));
  document.execCommand('styleWithCSS',false,false);
  document.execCommand('fontSize',false,'7');
  var areas=['mkt-daily-report-area','mkt-review-area'];
  var found=false;
  areas.forEach(function(id){
    var area=document.getElementById(id);
    if(area){area.querySelectorAll('font[size="7"]').forEach(function(el){
      var sp=document.createElement('span');sp.style.fontSize=newSize+'px';
      while(el.firstChild)sp.appendChild(el.firstChild);
      el.parentNode.replaceChild(sp,el);found=true;
    });}
  });
  if(!found){
    document.querySelectorAll('.mkt-editable font[size="7"]').forEach(function(el){
      var sp=document.createElement('span');sp.style.fontSize=newSize+'px';
      while(el.firstChild)sp.appendChild(el.firstChild);
      el.parentNode.replaceChild(sp,el);
    });
  }
  mktFmtAfterSave();
}

function mktAutoSave(el){
  var type=el.dataset.type;if(!type)return;
  if(type==='budget'){
    var ch=el.dataset.ch,mon=el.dataset.mon;
    var v=parseInt(el.innerText.trim().replace(/[^0-9]/g,''))||0;
    if(!MKT_BUDGET[ch])MKT_BUDGET[ch]={};MKT_BUDGET[ch][mon]=v;
  }else if(type==='target'){
    MKT_TARGET[el.dataset.mon]=parseInt(el.innerText.trim().replace(/[^0-9]/g,''))||0;
  }else if(type==='spend_total'){
    MKT_SPEND_TOTAL[el.dataset.mon]=parseInt(el.innerText.trim().replace(/[^0-9]/g,''))||0;
  }else if(type==='weekly'){
    var v=parseInt(el.innerText.trim().replace(/[^0-9]/g,''))||0;
    if(!MKT_WEEKLY[el.dataset.mon])MKT_WEEKLY[el.dataset.mon]={};
    if(!MKT_WEEKLY[el.dataset.mon][el.dataset.wk])MKT_WEEKLY[el.dataset.mon][el.dataset.wk]={};
    MKT_WEEKLY[el.dataset.mon][el.dataset.wk][el.dataset.key]=v;
  }else if(type==='review'){
    if(!MKT_REVIEW)MKT_REVIEW={};MKT_REVIEW[el.dataset.mon]=el.innerHTML;
  }
}

function mktCellSave(el){
  var type=el.dataset.type;
  var raw=el.innerText.trim().replace(/,/g,'').replace(/원/g,'');
  var val=parseInt(raw)||0;
  if(type==='budget'){
    var ch=el.dataset.ch,mon=el.dataset.mon;
    if(!MKT_BUDGET[ch])MKT_BUDGET[ch]={};
    MKT_BUDGET[ch][mon]=val;
    var rowTotal=MKT_MONS.reduce(function(a,m){return a+((MKT_BUDGET[ch]||{})[m]||0);},0);
    var rowEl=document.getElementById('mkt-brow-'+ch);
    if(rowEl)rowEl.textContent=rowTotal?rowTotal.toLocaleString('ko-KR'):'';
    var colTotal=MKT_CHS.reduce(function(a,c){return a+((MKT_BUDGET[c]||{})[mon]||0);},0);
    var colEl=document.getElementById('mkt-bcol-'+mon);
    if(colEl)colEl.textContent=colTotal?colTotal.toLocaleString('ko-KR'):'';
    var grand=MKT_CHS.reduce(function(a,c){return a+MKT_MONS.reduce(function(b,m){return b+((MKT_BUDGET[c]||{})[m]||0);},0);},0);
    var grandEl=document.getElementById('mkt-bgrand');
    if(grandEl)grandEl.textContent=grand?grand.toLocaleString('ko-KR'):'';
  } else if(type==='target'){
    var tmon=el.dataset.mon;
    if(!MKT_TARGET)MKT_TARGET={};
    MKT_TARGET[tmon]=val;
    // 비중 업데이트
    var bColEl=document.getElementById('mkt-bcol-'+tmon);
    var budgetV=bColEl?parseInt(bColEl.textContent.replace(/,/g,''))||0:0;
    var ratioEl=document.getElementById('mkt-ratio-'+tmon);
    if(ratioEl)ratioEl.textContent=val?(budgetV/val*100).toFixed(1)+'%':'';
  } else if(type==='spend_total'){
    var smon=el.dataset.mon;
    if(!MKT_SPEND_TOTAL)MKT_SPEND_TOTAL={};
    MKT_SPEND_TOTAL[smon]=val;
  } else if(type==='weekly'){
    var mon2=el.dataset.mon,wk=el.dataset.wk,key=el.dataset.key;
    if(!MKT_WEEKLY[mon2])MKT_WEEKLY[mon2]={};
    if(!MKT_WEEKLY[mon2][wk])MKT_WEEKLY[mon2][wk]={};
    MKT_WEEKLY[mon2][wk][key]=val;
    mktUpdateWeeklyTotals(mon2,wk);
  }
  // 조용히 저장 (toast 없음)
  try{
    localStorage.setItem('sinoon_mkt_budget',JSON.stringify(MKT_BUDGET));
    localStorage.setItem('sinoon_mkt_spend',JSON.stringify(MKT_SPEND));
    localStorage.setItem('sinoon_mkt_target',JSON.stringify(MKT_TARGET));
    localStorage.setItem('sinoon_mkt_spend_total',JSON.stringify(MKT_SPEND_TOTAL));
    localStorage.setItem('sinoon_mkt_weekly',JSON.stringify(MKT_WEEKLY));
    localStorage.setItem('sinoon_mkt_review',JSON.stringify(MKT_REVIEW));
    localStorage.setItem('sinoon_mkt_daily_report',JSON.stringify(MKT_DAILY_REPORT));
    localStorage.setItem('sinoon_mkt_daily_table',JSON.stringify(MKT_DAILY_TABLE));
  }catch(e){}
}

function mktUpdateWeeklyTotals(mon,wk){
  var monData=MKT_WEEKLY[mon]||{};
  var wkData=monData[wk]||{};
  var budget=wkData['budget']||0;
  var spend=MKT_CHS.reduce(function(a,ch){return a+(wkData[ch]||0);},0);
  var spendEl=document.getElementById('mkt-w-spend-'+wk);
  var achEl=document.getElementById('mkt-w-ach-'+wk);
  if(spendEl)spendEl.textContent=spend?spend.toLocaleString('ko-KR'):'';
  if(achEl){
    achEl.textContent=budget?(spend/budget*100).toFixed(1)+'%':'-%';
    achEl.style.color=budget?(spend/budget>=1?'#2a7a4f':spend/budget>=0.8?'#e6a23c':'#c0392b'):'#999';
  }
  MKT_CHS.forEach(function(ch){
    var colSpend=MKT_WKS.reduce(function(a,w){return a+(((monData[w]||{})[ch])||0);},0);
    var colEl=document.getElementById('mkt-wcol-'+ch);
    if(colEl)colEl.textContent=colSpend?colSpend.toLocaleString('ko-KR'):'';
  });
  var totalBudget=MKT_WKS.reduce(function(a,w){return a+((monData[w]||{})['budget']||0);},0);
  var totalSpend=MKT_CHS.reduce(function(a,ch){return a+MKT_WKS.reduce(function(b,w){return b+(((monData[w]||{})[ch])||0);},0);},0);
  var tbEl=document.getElementById('mkt-wtotal-budget');
  var tsEl=document.getElementById('mkt-wtotal-spend');
  var taEl=document.getElementById('mkt-wtotal-ach');
  if(tbEl)tbEl.textContent=totalBudget?totalBudget.toLocaleString('ko-KR'):'';
  if(tsEl)tsEl.textContent=totalSpend?totalSpend.toLocaleString('ko-KR'):'';
  if(taEl){
    taEl.textContent=totalBudget?(totalSpend/totalBudget*100).toFixed(1)+'%':'-%';
    taEl.style.color=totalBudget?(totalSpend/totalBudget>=1?'#2a7a4f':totalSpend/totalBudget>=0.8?'#e6a23c':'#c0392b'):'#999';
  }
}

function mktHandleDragover(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='copy';
  var el=e.currentTarget;
  el.style.outline='2px dashed #1a1a2e';
}
function mktHandleDragleave(e){
  e.currentTarget.style.outline='';

function mktHandleDrop(e,el){
  e.preventDefault();
  el.style.outline='';
  if(!mktUnlocked){return;}
  var files=e.dataTransfer.files;
  var items=e.dataTransfer.items;
  // 이미지 파일 처리
  if(files&&files.length){
    Array.from(files).forEach(function(file){
      if(!file.type.startsWith('image/'))return;
      var reader=new FileReader();
      reader.onload=function(ev){
        el.focus();
        var html='<img src="'+ev.target.result+'" style="max-width:100%;height:auto;border-radius:6px;margin:6px 0;display:block;box-shadow:0 2px 8px #0001;">';
        document.execCommand('insertHTML',false,html);
        if(el.id==='mkt-daily-report-area')mktSaveDailyReport();
        else if(el.id==='mkt-review-area')mktSaveReview();
      };
      reader.readAsDataURL(file);
    });
    return;
  }
  // 클립보드에서 이미지 (브라우저 내 드래그)
  if(items){
    Array.from(items).forEach(function(item){
      if(item.kind==='file'&&item.type.startsWith('image/')){
        var file=item.getAsFile();
        var reader=new FileReader();
        reader.onload=function(ev){
          el.focus();
          var html='<img src="'+ev.target.result+'" style="max-width:100%;height:auto;border-radius:6px;margin:6px 0;display:block;box-shadow:0 2px 8px #0001;">';
          document.execCommand('insertHTML',false,html);
          if(el.id==='mkt-daily-report-area')mktSaveDailyReport();
          else if(el.id==='mkt-review-area')mktSaveReview();
        };
        reader.readAsDataURL(file);
      }
    });
  }
}

function _applyFreshData(fresh) {
  if (!fresh || fresh.error) return;
  ['monthly26','daily26','weekly26','month_ranking','week_ranking','top20_all','ch_top20','MONTHLY_AOV'].forEach(k=>{
    if (fresh[k] !== undefined) D[k] = fresh[k];
  });
  if (fresh.STOCK_MAP) {
    D.STOCK_MAP = fresh.STOCK_MAP;
    const flatStk = {}, flatCst = {};
    for (const k in fresh.STOCK_MAP) {
      const v = fresh.STOCK_MAP[k];
      if (v && typeof v === 'object') {
        flatStk[k] = v.stock || 0;
        if (v.cost) flatCst[k] = v.cost;
      } else {
        flatStk[k] = v || 0;
      }
    }
    Object.keys(STOCK_MAP).forEach(k=>delete STOCK_MAP[k]);
    Object.assign(STOCK_MAP, flatStk);
    if (Object.keys(flatCst).length) {
      Object.keys(COST_MAP).forEach(k=>delete COST_MAP[k]);
      Object.assign(COST_MAP, flatCst);
    }
  }
  if (fresh.ps_data) {
    for (const code in fresh.ps_data) {
      if (D.ps_data && D.ps_data[code]) {
        if (D.ps_data[code].item)   fresh.ps_data[code].item   = D.ps_data[code].item;
        if (D.ps_data[code].season) fresh.ps_data[code].season = D.ps_data[code].season;
        if (D.ps_data[code].co)     fresh.ps_data[code].co     = D.ps_data[code].co;
      }
    }
    D.ps_data = fresh.ps_data;
  }
  if (fresh.PROMO_DATA) D.PROMO_DATA = fresh.PROMO_DATA;

  // ── D.dates / D.weeks / D.months / D.month_to_dates / D.month_to_weeks 재계산 ──
  // in-place 업데이트 (const MONTHS=D.months 등 참조 유지를 위해 splice 사용)
  const _nd = Object.keys(D.daily26 || {}).filter(d => /^2026-/.test(d)).sort();
  const _pwFn = s => { const _m = s.match(/(\d+)월(\d+)주/); return _m ? parseInt(_m[1])*100 + parseInt(_m[2]) : 0; };
  const _nw = Object.keys(D.weekly26 || {}).sort((a, b) => _pwFn(a) - _pwFn(b));
  const _nm = Object.keys(D.monthly26 || {}).sort((a, b) => (parseInt(a)||0) - (parseInt(b)||0));
  D.dates.splice(0, D.dates.length, ..._nd);
  D.weeks.splice(0, D.weeks.length, ..._nw);
  D.months.splice(0, D.months.length, ..._nm);
  const _m2d = {}, _m2w = {};
  D.dates.forEach(dt => {
    const mon = parseInt(dt.split('-')[1]) + '월';
    if (!_m2d[mon]) _m2d[mon] = [];
    _m2d[mon].push(dt);
  });
  D.weeks.forEach(wk => {
    const mon = wk.replace(/\d+주$/, '');
    if (!_m2w[mon]) _m2w[mon] = [];
    _m2w[mon].push(wk);
  });
  D.month_to_dates = _m2d;
  D.month_to_weeks = _m2w;
  if (fresh.week_to_dates) D.week_to_dates = fresh.week_to_dates;
  // 2025 일별 전년실적 업데이트
  if (fresh.daily25 && Object.keys(fresh.daily25).length > 0) D.daily25 = fresh.daily25;
  // MONTHLY_AOV 전역 변수 업데이트 (GS는 {aov,orders,sales} 형태로 반환)
  if (fresh.MONTHLY_AOV) {

      for (const mon in fresh.MONTHLY_AOV[ch]) {
        const v = fresh.MONTHLY_AOV[ch][mon];
        MONTHLY_AOV[ch][mon] = (v && typeof v === 'object') ? v.aov : v;
      }
    }
  }
}

  el.innerHTML='<div style="max-width:1400px;margin:0 auto;padding:0 4px;">'
  +'<div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;">'
  +'<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:28px;">🏮</span>'
  +'<div><div style="font-size:22px;font-weight:800;color:#2d2926;">MANTOVA</div>'
  +'<div style="font-size:12px;color:#888;">만토바 온라인 매출 & 주간미팅 대시보드</div></div></div>'
  +'<div style="position:relative;margin-left:auto;" id="mt-filter-wrap">'
  +'<button onclick="mtToggleFilter(event)" style="display:flex;align-items:center;gap:8px;padding:10px 18px;background:#2d2926;color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;">'
  +'<span>📅</span><span id="mt-filter-label">8월</span><span id="mt-filter-arrow">▾</span></button>'
  +'<div id="mt-filter-panel" style="display:none;position:absolute;top:48px;right:0;background:#fff;border:1px solid #e0e0e0;border-radius:14px;padding:16px;min-width:280px;box-shadow:0 8px 32px rgba(0,0,0,.12);z-index:100;">'
  +'<div style="font-size:12px;color:#888;margin-bottom:10px;font-weight:600;">월 클릭 시 주차 버튼 표시, 중복 선택 가능</div>'
  +'<div id="mt-filter-months"></div></div></div>'
  +'<div style="display:flex;gap:6px;">'
  +'<button id="mt-krw-btn" onclick="mtSetCurrency(true)" style="padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;background:#a5d6a7;color:#1b5e20;">₩ 원</button>'
  +'<button id="mt-cny-btn" onclick="mtSetCurrency(false)" style="padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;background:#f5f5f5;color:#555;">¥ 위안</button>'
  +'</div></div>'
  +'<div style="background:#fff;border-radius:16px;padding:20px;border:1px solid #eee;margin-bottom:20px;overflow-x:auto;">'
  +'<div style="font-size:15px;font-weight:800;color:#2d2926;margin-bottom:14px;">📊 온라인 주별 매출</div><div id="mt-sales-table"></div></div>'
  +'<div style="background:#fff;border-radius:16px;padding:20px;border:1px solid #eee;margin-bottom:20px;">'
  +'<div style="font-size:15px;font-weight:800;color:#2d2926;margin-bottom:14px;">🏆 BEST 20</div><div id="mt-top20-content"></div></div>'
  +'<div style="background:#fff;border-radius:16px;padding:20px;border:1px solid #eee;margin-bottom:20px;">'

  +'<div style="font-size:15px;font-weight:800;color:#2d2926;">📝 주간 회의록</div>'

  +'<div id="mt-meeting-content"></div></div></div>';
  mtInitTab();

async function mtInitTab(){
  Object.keys(MANTOVA.months).forEach(function(m){MT_STATE.expandedMonths[m]=false;MT_STATE.selected[m]=new Set();});
  MT_STATE.selected['8월']=new Set(MANTOVA.months['8월'].weeks);
  MT_STATE.expandedMonths['8월']=true;
  for(var m of Object.keys(MANTOVA.months))MT_STATE.rates[m]=await mtGetRate(m);
  try{var fr=await fetch(MT_FB_URL+'.json');if(fr.ok){var fd=await fr.json();if(fd)MT_FB_MEETINGS=fd;}}catch(e){}
  mtRenderFilterPanel();mtUpdateFilterLabel();mtRenderSalesTable();mtRenderTop20();mtRenderMeeting();
  document.addEventListener('click',function(e){var w=document.getElementById('mt-filter-wrap');if(w&&!w.contains(e.target)){var p=document.getElementById('mt-filter-panel');if(p)p.style.display='none';MT_STATE.filterOpen=false;var a=document.getElementById('mt-filter-arrow');if(a)a.textContent='▾';}});
}

function mtToggleFilter(e){if(e)e.stopPropagation();MT_STATE.filterOpen=!MT_STATE.filterOpen;document.getElementById('mt-filter-panel').style.display=MT_STATE.filterOpen?'block':'none';document.getElementById('mt-filter-arrow').textContent=MT_STATE.filterOpen?'▴':'▾';}

function mtRenderFilterPanel(){
  var el=document.getElementById('mt-filter-months');if(!el)return;var html='';
  Object.keys(MANTOVA.months).forEach(function(m){
    var md=MANTOVA.months[m],exp=MT_STATE.expandedMonths[m];
    var allS=MT_STATE.selected[m]&&MT_STATE.selected[m].size===md.weeks.length;
    var somS=MT_STATE.selected[m]&&MT_STATE.selected[m].size>0;
    html+='<div style="margin-bottom:8px;">';
    html+='<button data-m="'+m+'" onclick="mtToggleMonth(event,this.dataset.m)" style="padding:7px 16px;border-radius:8px;border:2px solid #2d2926;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;background:'+(allS?'#2d2926':(somS?'#f5f0eb':'#fff'))+';color:'+(allS?'#fff':'#2d2926')+';width:100%;text-align:left;">'+m+' '+(exp?'▴':'▾')+'</button>';
    if(exp){
      html+='<div style="display:flex;flex-wrap:wrap;gap:6px;padding:8px 4px 4px;">';
      md.weeks.forEach(function(w){
        var s=MT_STATE.selected[m]&&MT_STATE.selected[m].has(w);
        html+='<button data-m="'+m+'" data-w="'+w+'" onclick="mtToggleWeek(event,this.dataset.m,this.dataset.w)" style="padding:5px 10px;border-radius:6px;border:1.5px solid '+(s?'#2d2926':'#ccc')+';font-size:12px;font-family:inherit;cursor:pointer;background:'+(s?'#a5d6a7':'#f5f5f5')+';color:'+(s?'#1b5e20':'#555')+';font-weight:600;">'+w+'</button>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  el.innerHTML=html;
}
function mtToggleMonth(e,m){if(e)e.stopPropagation();var md=MANTOVA.months[m],exp=MT_STATE.expandedMonths[m];if(!exp){MT_STATE.expandedMonths[m]=true;MT_STATE.selected[m]=new Set(md.weeks);}else{var a=MT_STATE.selected[m]&&MT_STATE.selected[m].size===md.weeks.length;MT_STATE.selected[m]=a?new Set():new Set(md.weeks);}mtRenderFilterPanel();mtUpdateFilterLabel();mtRenderSalesTable();mtRenderTop20();}
function mtToggleWeek(e,m,w){if(e)e.stopPropagation();if(!MT_STATE.selected[m])MT_STATE.selected[m]=new Set();if(MT_STATE.selected[m].has(w))MT_STATE.selected[m].delete(w);else MT_STATE.selected[m].add(w);mtRenderFilterPanel();mtUpdateFilterLabel();mtRenderSalesTable();mtRenderTop20();}
function mtUpdateFilterLabel(){var p=[];Object.keys(MANTOVA.months).forEach(function(m){if(MT_STATE.selected[m]&&MT_STATE.selected[m].size>0)p.push(m);});var e=document.getElementById('mt-filter-label');if(e)e.textContent=p.length?p.join(', '):'기간 선택';}
function mtSetCurrency(k){MT_STATE.showKRW=k;var kb=document.getElementById('mt-krw-btn'),cb=document.getElementById('mt-cny-btn');if(kb){kb.style.background=k?'#a5d6a7':'#f5f5f5';kb.style.color=k?'#1b5e20':'#555';}if(cb){cb.style.background=!k?'#90caf9':'#f5f5f5';cb.style.color=!k?'#0d47a1':'#555';}mtRenderSalesTable();}
function mtFV(v,r){if(!v||v===0)return'<span style="color:#ccc">-</span>';return MT_STATE.showKRW?'₩'+Math.round(v*r).toLocaleString():'¥'+v.toLocaleString();}

function mtRenderSalesTable(){
  var el=document.getElementById('mt-sales-table');if(!el)return;
  var cols=[];Object.keys(MANTOVA.months).forEach(function(m){MANTOVA.months[m].weeks.forEach(function(w){if(MT_STATE.selected[m]&&MT_STATE.selected[m].has(w))cols.push({month:m,week:w,rate:MT_STATE.rates[m]||195});});});
  if(!cols.length){el.innerHTML='<div style="text-align:center;color:#aaa;padding:30px;">기간을 선택하세요.</div>';return;}
  var CH=['티몰','샤오홍슈','도우인'],CC={'티몰':'#ff6900','샤오홍슈':'#ff2d55','도우인':'#333'};
  var thS='padding:9px 12px;text-align:center;font-size:12px;font-weight:700;background:#2d2926;color:#fff;white-space:nowrap;';
  var tdS='padding:8px 12px;text-align:right;font-size:13px;white-space:nowrap;border-bottom:1px solid #f5f5f5;';
  var pm='',html='<table style="width:100%;border-collapse:collapse;min-width:500px;"><thead><tr><th style="'+thS+'text-align:left;">채널</th>';
  cols.forEach(function(c){var ml=c.month!==pm?'<div style="font-size:10px;opacity:.7;">'+c.month+'</div>':'';pm=c.month;html+='<th style="'+thS+'">'+ml+c.week+'</th>';});
  html+='<th style="'+thS+'">합계</th></tr></thead><tbody>';
  CH.forEach(function(ch){var rt=0,rh='',hd=false;cols.forEach(function(c){var wi=MANTOVA.months[c.month].weeks.indexOf(c.week),v=(MANTOVA.months[c.month].channels[ch]||[])[wi]||0;if(v>0)hd=true;rt+=v;rh+='<td style="'+tdS+'">'+mtFV(v,c.rate)+'</td>';});if(!hd)return;var ar=cols.reduce(function(a,c){return a+(MT_STATE.rates[c.month]||195);},0)/cols.length;html+='<tr><td style="padding:8px 14px;font-size:13px;font-weight:700;border-bottom:1px solid #f5f5f5;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+(CC[ch]||'#999')+';margin-right:6px;"></span>'+ch+'</td>'+rh+'<td style="'+tdS+'font-weight:700;">'+mtFV(rt,ar)+'</td></tr>';});
  html+='<tr style="background:#f9f9f9;"><td style="padding:9px 14px;font-size:13px;font-weight:800;border-top:2px solid #2d2926;">합계</td>';
  var gt=0;cols.forEach(function(c){var wi=MANTOVA.months[c.month].weeks.indexOf(c.week),cs=0;CH.forEach(function(ch){cs+=(MANTOVA.months[c.month].channels[ch]||[])[wi]||0;});gt+=cs;html+='<td style="'+tdS+'font-weight:800;border-top:2px solid #2d2926;">'+mtFV(cs,c.rate)+'</td>';});
  var ar2=cols.reduce(function(a,c){return a+(MT_STATE.rates[c.month]||195);},0)/cols.length;
  html+='<td style="'+tdS+'font-weight:800;border-top:2px solid #2d2926;">'+mtFV(gt,ar2)+'</td></tr></tbody></table>';
  el.innerHTML=html;
}

function mtRenderTop20(){
  var el=document.getElementById('mt-top20-content');if(!el)return;
  var sm=Object.keys(MANTOVA.months).filter(function(m){return MT_STATE.selected[m]&&MT_STATE.selected[m].size>0;}),k=null;
  for(var i=sm.length-1;i>=0;i--){if(MT_TOP20_MONTH_MAP[sm[i]]){k=MT_TOP20_MONTH_MAP[sm[i]];break;}}
  if(!k||!MT_TOP20_IMGS){el.innerHTML='<div style="text-align:center;padding:40px;color:#aaa;">해당 기간의 BEST 20 데이터가 없습니다.</div>';return;}
  var lbl=k.replace(/(\d{4})(\d{2})(\d{2})-(\d{4})(\d{2})(\d{2})/,'$1.$2.$3-$5.$6');
  el.innerHTML='<div style="font-size:12px;color:#888;margin-bottom:12px;">DATA '+lbl+'</div><img src="'+MT_TOP20_IMGS+'" style="width:100%;border-radius:10px;border:1px solid #eee;" />';
}
function mtRenderMeeting(){
  var btnEl=document.getElementById('mt-meeting-week-btns');if(!btnEl)return;
  var keys=new Set(Object.keys(MT_MEETINGS_DEFAULT));
  var sk=Array.from(keys).sort().reverse();
  if(!MT_MEETING_KEY&&sk.length)MT_MEETING_KEY=sk[0];
  var html=sk.map(function(k){var s=k===MT_MEETING_KEY;return'<button data-k="'+k+'" onclick="mtSelectMeetingKey(this.dataset.k)" style="padding:6px 14px;border-radius:8px;border:1.5px solid '+(s?'#2d2926':'#ddd')+';background:'+(s?'#2d2926':'#f5f5f5')+';color:'+(s?'#fff':'#555')+';font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">'+k+'</button>';}).join('');
  if(!html)html='<span style="font-size:12px;color:#aaa;">저장된 회의록 없음</span>';
  btnEl.innerHTML=html;mtRenderMeetingContent(MT_MEETING_KEY);
}

function mtSelectMeetingKey(k){MT_MEETING_KEY=k;MT_MEETING_EDIT=false;mtRenderMeeting();}

function mtRenderMeetingContent(key){
  var el=document.getElementById('mt-meeting-content');if(!el)return;
  if(!key){el.innerHTML='<div style="color:#aaa;text-align:center;padding:30px;">날짜를 선택하세요.</div>';return;}
  var saved=MT_FB_MEETINGS[key]||localStorage.getItem('mt_meeting_'+key)||MT_MEETINGS_DEFAULT[key]||'';
  var esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');};
  if(MT_MEETING_EDIT){
    el.innerHTML='<textarea id="mt-memo-ta" style="width:100%;height:420px;padding:14px;border:1.5px solid #ddd;border-radius:10px;font-size:13px;font-family:inherit;resize:vertical;line-height:1.7;box-sizing:border-box;">'+esc(saved)+'</textarea>'
    +'<div style="display:flex;gap:8px;margin-top:10px;"><button data-key2="'+key+'" onclick="mtSaveMemo(this.dataset.key2)" style="padding:9px 20px;background:#2d2926;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;font-family:inherit;">💾 저장 (전직원 동기화)</button>'
    +'<button onclick="MT_MEETING_EDIT=false;mtRenderMeeting();" style="padding:9px 20px;background:#f5f5f5;color:#555;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;">취소</button></div>';
  }else if(saved){
    el.innerHTML='<div style="position:relative;"><pre style="font-size:13px;line-height:1.8;color:#333;white-space:pre-wrap;font-family:inherit;background:#fafafa;padding:16px;border-radius:10px;border:1px solid #f0f0f0;margin:0;">'+esc(saved)+'</pre>'
    +'<button onclick="mtCheckPwAndEdit()" style="position:absolute;top:12px;right:12px;padding:6px 12px;background:#2d2926;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;">✏️ 편집</button></div>';
  }else{
    el.innerHTML='<div style="text-align:center;padding:40px;color:#aaa;"><div style="font-size:32px;margin-bottom:10px;">📝</div><div style="font-size:14px;font-weight:600;">이 날짜의 회의록이 없습니다.</div><button onclick="mtCheckPwAndEdit()" style="margin-top:14px;padding:9px 20px;background:#2d2926;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-family:inherit;">+ 회의록 작성</button></div>';
  }
}

function mtCheckPwAndEdit(){var pw=prompt('편집 비밀번호를 입력하세요:');if(pw!=='1111'){alert('비밀번호가 맞지 않습니다.');return;}MT_MEETING_EDIT=true;mtRenderMeetingContent(MT_MEETING_KEY);}

async function mtSaveMemo(key){
  var val=document.getElementById('mt-memo-ta').value;
  localStorage.setItem('mt_meeting_'+key,val);
  try{
    await fetch(MT_FB_URL+'/'+key+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)});
    MT_FB_MEETINGS[key]=val;
    alert('저장 완료 ✅ 전직원 동기화됨');
  }catch(e){alert('로컬 저장 완료 (네트워크 오류로 동기화 실패)');}
  MT_MEETING_EDIT=false;mtRenderMeeting();
}


function renderFunnelInsights(){
  var el=document.getElementById('t3funnel-insights');if(!el)return;
  var mon=typeof _funnelPeriod!=='undefined'?_funnelPeriod:null;
  if(!mon||typeof FUNNEL_DATA==='undefined'||!FUNNEL_DATA[mon]){el.innerHTML='';return;}
  var steps=FUNNEL_DATA[mon].steps;
  var visit=steps.find(function(s){return s.stage==='방문';});
  var pay=steps.find(function(s){return s.stage==='결제 완료';});
  var visitN=visit?visit.s.toLocaleString():'--';
  var payN=pay?pay.s.toLocaleString():'--';
  var convRate=visit&&pay?(pay.s/visit.s*100).toFixed(2)+'%':'--';
  var maxChurn=null,maxChurnStage='--';
  steps.forEach(function(s){if(s.churn!=null&&(maxChurn===null||s.churn>maxChurn)){maxChurn=s.churn;maxChurnStage=s.stage;}});
  var box='background:#fff;border:1px solid #e8e6e4;border-radius:8px;padding:10px 12px;text-align:center;';
  var lbl='font-size:11px;color:#7a7470;font-weight:700;margin-bottom:6px;letter-spacing:.04em;';
  el.innerHTML='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:4px;">'
    +'<div style="'+box+'">'+'<div style="'+lbl+'">방문자수</div>'
    +'<div style="font-size:22px;font-weight:800;color:#2d2926;">'+visitN+'</div></div>'
    +'<div style="'+box+'">'+'<div style="'+lbl+'">구매자수</div>'
    +'<div style="font-size:22px;font-weight:800;color:#2d2926;">'+payN+'</div></div>'
    +'<div style="'+box+'">'+'<div style="'+lbl+'">구매 전환율</div>'
    +'<div style="font-size:22px;font-weight:800;color:#2d2926;">'+convRate+'</div></div>'
    +'<div style="'+box+'">'+'<div style="'+lbl+'">최대 이탈 구간</div>'
    +'<div style="font-size:14px;font-weight:800;color:#c0392b;line-height:1.3;">'+maxChurnStage+'</div>'
    +(maxChurn!=null?'<div style="font-size:11px;color:#c0392b;margin-top:3px;">이탈률 '+maxChurn.toFixed(1)+'%</div>':'')+'</div>'
    +'</div>';
}
(function(){
  if(typeof setT3GlobalMon==='function'){
    var _orig=setT3GlobalMon;
    window.setT3GlobalMon=function(m){_orig(m);renderFunnelInsights();};
  }
})();
