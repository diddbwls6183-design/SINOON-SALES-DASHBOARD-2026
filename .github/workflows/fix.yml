name: Fix Dashboard SyntaxError
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore good base
        run: git checkout 9893bb4 -- index.html
      - name: Remove FB and LS lines
        run: |
          sed -i "/Object.keys(MT_FB_MEETINGS).forEach/d" index.html
          sed -i "/lk.startsWith.*mt_meeting_/d" index.html
      - name: Run analytics update
        run: python3 update_analytics.py
      - name: Commit and push
        run: |
          git config user.email "bot@github.com"
          git config user.name "bot"
          git add index.html
          git commit -m "update: analytics 8/9월 데이터 추가" || echo skip
          git push
