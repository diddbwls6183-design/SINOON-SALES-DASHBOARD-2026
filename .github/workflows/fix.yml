name: Fix Dashboard SyntaxError
on: workflow_dispatch
jobs:
  fix:
      runs-on: ubuntu-latest
          permissions:
                contents: write
                    steps:
                          - uses: actions/checkout@v4
                                - name: Fix
                                        run: |
                                                  sed -i "/Object.keys(MT_FB_MEETINGS).forEach.*keys.add/d" index.html
                                                            sed -i "/lk.startsWith.*mt_meeting_/d" index.html
                                                                      echo done $(wc -l < index.html)
                                                                            - name: Commit
                                                                                    run: |
                                                                                              git config user.email "bot@github.com"
                                                                                                        git config user.name "bot"
                                                                                                                  git add index.html
                                                                                                                            git commit -m "fix: FB/LS lines" || echo skip
                                                                                                                                      git push
